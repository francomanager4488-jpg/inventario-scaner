<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta 
name="viewport" 
content="width=device-width, initial-scale=1">

<title>Ropita de Cuento</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;
    padding:20px;

    background:#f2f2f2;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

}


.card{

    max-width:720px;

    margin:auto;

    background:white;

    border-radius:14px;

    padding:20px;

    box-shadow:
    0 3px 15px rgba(0,0,0,.15);

}



h1,
h2,
h3{

    text-align:center;

    margin-top:0;

}



label{

    display:block;

    margin-top:15px;

    font-weight:bold;

    font-size:17px;

}



input,
select{

    width:100%;

    padding:14px;

    margin-top:8px;

    font-size:18px;

    border-radius:8px;

    border:1px solid #ccc;

}



button{

    width:100%;

    padding:15px;

    margin-top:12px;

    font-size:20px;

    border:none;

    border-radius:10px;

    cursor:pointer;

}



.azul{

    background:#1976d2;

    color:white;

}



.verde{

    background:#43a047;

    color:white;

}



.gris{

    background:#757575;

    color:white;

}



.rojo{

    background:#c62828;

    color:white;

}



.ficha{

    background:#fafafa;

    border:1px solid #ddd;

    border-radius:10px;

    padding:15px;

    margin-top:15px;

}



.dato{

    font-size:18px;

    margin:8px 0;

}



.nombre{

    font-size:28px;

    font-weight:bold;

    color:#1565c0;

}



.oculto{

    display:none;

}



#reader{

    margin-top:20px;

}



.tabla{

    width:100%;

    border-collapse:collapse;

}



.tabla td{

    padding:10px;

    border-bottom:
    1px solid #ddd;

}



.cantidad{

    width:90px;

}



.cantidad input{

    text-align:center;

}



.opciones{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

    margin-top:15px;

}



.opcion{

    background:#eeeeee;

    padding:15px;

    border-radius:10px;

    text-align:center;

    font-size:18px;

    cursor:pointer;

}



.opcion.activo{

    background:#1976d2;

    color:white;

}



</style>

</head>

<body>


<div class="card">


<!-- ================================= -->
<!-- MENU PRINCIPAL -->
<!-- ================================= -->


<div id="menuPrincipal">


<h2>
📦 ROPITA DE CUENTO
</h2>


<button
class="azul"
onclick="abrirBusqueda()">

🔍 Buscar prenda

</button>


<button
class="verde"
onclick="abrirNuevaCompra()">

📦 Nueva compra

</button>


<button
class="gris">

🏷 Imprimir etiquetas

</button>


<button
class="gris">

📊 Inventario

</button>


<button
class="gris">

⚙ Configuración

</button>


</div>





<!-- ================================= -->
<!-- BUSQUEDA -->
<!-- ================================= -->


<div
id="pantallaBusqueda"
class="oculto">


<h2>
Buscar prenda
</h2>


<input

id="codigo"

placeholder="Escanear o escribir código">


<button

class="verde"

onclick="iniciarCamara()">

📷 Escanear código

</button>


<button

class="azul"

onclick="buscar()">

Buscar

</button>



<div id="reader"></div>



<div
id="resultado">

</div>



<button

class="gris"

onclick="volverMenu()">

← Volver

</button>


</div>







<!-- ================================= -->
<!-- NUEVA COMPRA -->
<!-- ================================= -->


<div

id="pantallaNuevaCompra"

class="oculto">



<h2>

Nueva compra

</h2>



<label>

Fecha

</label>


<input

type="date"

id="fechaCompra">





<label>

Proveedor

</label>


<select

id="proveedor">

<option value="">

Seleccione proveedor...

</option>

</select>





<label>

Género

</label>


<select

id="generoCompra">


<option value="">

Seleccione...

</option>


</select>





<label>

Categoría

</label>


<select

id="categoria"

onchange="cargarSubcategorias()">


<option value="">

Seleccione categoría...

</option>


</select>





<div

id="contenedorSubcategoria"

class="oculto">


<label>

Subcategoría

</label>


<select

id="subcategoria">


<option value="">

Seleccione...

</option>


</select>


</div>







<label>

Precio de compra

</label>


<input

type="number"

id="precioCompra"

step="0.01"

placeholder="0">





<label>

Observaciones

</label>


<input

id="obsCompra"

placeholder="Opcional">






<button

class="verde"

onclick="crearCompra()">


Continuar


</button>





<button

class="gris"

onclick="volverMenu()">


← Volver


</button>



</div>

<!-- ================================= -->
<!-- TIPO DE CARGA -->
<!-- ================================= -->


<div

id="pantallaTipoCarga"

class="oculto">


<h2>

¿Qué desea cargar?

</h2>



<button

class="azul"

onclick="iniciarCargaIndividual()">


👕 Prenda individual


</button>




<button

class="verde"

onclick="mostrarCurva()">


📦 Compra por curva


</button>




<button

class="gris"

onclick="volverNuevaCompra()">


← Volver


</button>



</div>







<!-- ================================= -->
<!-- CARGA POR CURVA -->
<!-- ================================= -->


<div

id="pantallaCurva"

class="oculto">


<h2>

Carga por curva

</h2>



<div

class="ficha">


<div>

<b>

Categoría:

</b>

<span id="resumenCategoriaCurva">

</span>

</div>



<div>

<b>

Subcategoría:

</b>

<span id="resumenSubcategoriaCurva">

</span>

</div>


</div>





<h3>

Seleccione cantidades

</h3>




<div

id="listaTalles">


</div>





<button

class="verde"

onclick="continuarCurva()">


Continuar


</button>





<button

class="gris"

onclick="volverTipoCarga()">


← Volver


</button>



</div>









<!-- ================================= -->
<!-- RESUMEN COMPRA -->
<!-- ================================= -->


<div

id="pantallaResumen"

class="oculto">


<h2>

Resumen de compra

</h2>




<div

id="datosResumen"

class="ficha">


</div>





<button

class="verde"

onclick="iniciarCargaPrendas()">


Comenzar carga


</button>




<button

class="gris"

onclick="volverCurva()">


← Modificar


</button>



</div>









<!-- ================================= -->
<!-- CARGA DE PRENDAS -->
<!-- ================================= -->


<div

id="pantallaCarga"

class="oculto">


<h2

id="tituloCarga">

Carga de prendas

</h2>




<div

id="datosCarga"

class="ficha">


</div>





<button

class="gris"

onclick="volverResumen()">


← Volver


</button>



</div>

<!-- ================================= -->
<!-- CONTENEDORES AUXILIARES -->
<!-- ================================= -->


<div id="contenedoresAuxiliares" class="oculto">


<!--
Estos contenedores no son visibles.
JavaScript los utilizará para manejar
datos dinámicos provenientes de Apps Script.
-->


<div id="datosProveedores"></div>


<div id="datosGeneros"></div>


<div id="datosCategorias"></div>


<div id="datosSubcategorias"></div>


<div id="datosColores"></div>


<div id="datosDiseños"></div>



</div>





</div>
<!-- FIN CARD -->




<script>





</script>




</body>

</html>
