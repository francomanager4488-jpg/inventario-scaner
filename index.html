<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Ropita de Cuento</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    padding:20px;
    background:#f3f3f3;
    font-family:Arial,Helvetica,sans-serif;

}

.card{

    max-width:700px;
    margin:auto;
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,.20);

}

h2,h3{

    text-align:center;
    margin-top:0;

}

label{

    display:block;
    margin-top:15px;
    font-weight:bold;

}

input,
select{

    width:100%;
    padding:14px;
    margin-top:8px;
    font-size:18px;

}

button{

    width:100%;
    padding:15px;
    margin-top:12px;
    border:none;
    border-radius:8px;
    font-size:20px;
    cursor:pointer;

}

.azul{

    background:#1976d2;
    color:white;

}

.verde{

    background:#43a047;
    color:white;

}

.gris{

    background:#757575;
    color:white;

}

.rojo{

    background:#c62828;
    color:white;

}

#reader{

    margin-top:20px;

}

#resultado{

    margin-top:20px;

}

.ficha{

    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    background:#fafafa;

}

.nombre{

    font-size:28px;
    font-weight:bold;
    color:#1565c0;
    margin-bottom:15px;

}

.dato{

    font-size:19px;
    margin:8px 0;

}

.stock-ok{

    color:green;
    font-weight:bold;

}

.stock-cero{

    color:red;
    font-weight:bold;

}

#menuPrincipal,
#pantallaBusqueda,
#pantallaNuevaCompra,
#pantallaCantidades,
#pantallaDatos,
#pantallaResumen,
#pantallaCarga{

    display:none;

}

#menuPrincipal{

    display:block;

}

.tablaTalles{

    width:100%;
    border-collapse:collapse;

}

.tablaTalles td{

    padding:10px;
    border-bottom:1px solid #ddd;

}

.celdaCantidad{

    width:90px;

}

.celdaCantidad input{

    text-align:center;

}

</style>

</head>

<body>

<div class="card">

<!-- ========================================= -->
<!-- MENU PRINCIPAL -->
<!-- ========================================= -->

<div id="menuPrincipal">

<h2>📦 ROPITA DE CUENTO</h2>

<button
class="azul"
onclick="abrirBusqueda()">

🔍 Buscar prenda

</button>

<button
class="verde"
onclick="abrirNuevaCompra()">

📦 Nueva compra

</button>

<button
class="gris"
onclick="alert('Próximamente')">

🏷 Imprimir etiquetas

</button>

<button
class="gris"
onclick="alert('Próximamente')">

📊 Inventario

</button>

<button
class="gris"
onclick="alert('Próximamente')">

⚙ Configuración

</button>

</div>

<!-- ========================================= -->
<!-- BUSQUEDA -->
<!-- ========================================= -->

<div id="pantallaBusqueda">

<h2>Buscar prenda</h2>

<input
id="codigo"
placeholder="Escanear o escribir código">

<button
class="verde"
onclick="iniciarCamara()">

📷 Escanear

</button>

<button
class="azul"
onclick="buscar()">

Buscar

</button>

<div id="reader"></div>

<div id="resultado"></div>

<button
class="gris"
onclick="volverMenu()">

← Volver

</button>

</div>

<!-- ========================================= -->
<!-- NUEVA COMPRA -->
<!-- ========================================= -->

<div id="pantallaNuevaCompra">

<h2>Nueva compra</h2>

<label>Fecha</label>

<input
type="date"
id="fechaCompra">

<label>Proveedor</label>

<input
id="proveedor"
placeholder="Proveedor">

<label>Marca (opcional)</label>

<input
id="marcaCompra"
placeholder="Marca">

<label>Género</label>

<select id="grupoCompra">

<option value="">Seleccione...</option>

<option value="BEBE">👶 Bebé</option>

<option value="BEBA">👧 Beba</option>

<option value="NENE">🧒 Nene</option>

<option value="NENA">👧 Nena</option>

<option value="UNISEX_BEBE">🍼 Unisex bebé</option>

<option value="UNISEX_NENE">👕 Unisex nene</option>

</select>

<label>Precio de compra</label>

<input
id="precioCompra"
type="number"
step="0.01"
placeholder="0">

<label>Tipo de prenda</label>

<input
id="tipoPrenda"
placeholder="Ej.: Remera">

<label>Observaciones</label>

<input
id="obsCompra"
placeholder="Opcional">

<button
class="verde"
onclick="crearCompra()">

Continuar

</button>

<button
class="gris"
onclick="volverMenu()">

← Volver

</button>

</div>

<!-- ========================================= -->
<!-- CANTIDAD POR TALLE -->
<!-- ========================================= -->

<div id="pantallaCantidades">

<h2 id="tituloCantidades">

Cantidad por talle

</h2>

<div id="listaCantidades">

</div>

<button
class="verde"
onclick="continuarCantidades()">

Continuar

</button>

<button
class="gris"
onclick="volverNuevaCompra()">

← Volver

</button>

</div>

<!-- ========================================= -->
<!-- RESUMEN -->
<!-- ========================================= -->

<div id="pantallaResumen">

<h2>Resumen</h2>

<div
id="datosResumen"
style="
background:#f5f5f5;
padding:15px;
border-radius:10px;
">

</div>

<button
class="verde"
onclick="iniciarCargaPrendas()">

Comenzar carga

</button>

<button
class="gris"
onclick="volverCantidades()">

← Volver

</button>

</div>

<!-- ========================================= -->
<!-- CARGA DE PRENDAS -->
<!-- ========================================= -->

<div id="pantallaCarga">

<h2 id="tituloCarga">

Carga de prendas

</h2>

<div
id="datosCarga"
style="
background:#f5f5f5;
padding:15px;
border-radius:10px;
">

</div>

<button
class="gris"
onclick="volverResumen()">

← Volver

</button>

</div>

</div>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbwsBLmhm8xSx3vsfYEurnFM9m7D4S8WVLrGRBKRmnsx6uHLRAhEHMvzTUXlCW_kFnpC/exec";

let grupoSeleccionado="";
let colaPrendas=[];
let indicePrenda=0;
let prendasGuardadas=[];

function ocultarPantallas(){

    document.getElementById("menuPrincipal").style.display="none";
    document.getElementById("pantallaBusqueda").style.display="none";
    document.getElementById("pantallaNuevaCompra").style.display="none";
    document.getElementById("pantallaCantidades").style.display="none";
    document.getElementById("pantallaResumen").style.display="none";
    document.getElementById("pantallaCarga").style.display="none";

}

function abrirBusqueda(){

    ocultarPantallas();

    document.getElementById("pantallaBusqueda").style.display="block";

}

function abrirNuevaCompra(){

    ocultarPantallas();

    document.getElementById("pantallaNuevaCompra").style.display="block";

    const hoy=new Date();

    document.getElementById("fechaCompra").value=
    hoy.toISOString().substring(0,10);

}

function volverMenu(){

    ocultarPantallas();

    document.getElementById("menuPrincipal").style.display="block";

}

function volverNuevaCompra(){

    ocultarPantallas();

    document.getElementById("pantallaNuevaCompra").style.display="block";

}

function volverCantidades(){

    ocultarPantallas();

    document.getElementById("pantallaCantidades").style.display="block";

}

function volverResumen(){

    ocultarPantallas();

    document.getElementById("pantallaResumen").style.display="block";

}

function crearCompra(){

    const fecha=
    document.getElementById("fechaCompra").value;

    const proveedor=
    document.getElementById("proveedor").value.trim();

    const marca=
    document.getElementById("marcaCompra").value.trim();

    const grupo=
    document.getElementById("grupoCompra").value;

    const precio=
    document.getElementById("precioCompra").value;

    const tipo=
    document.getElementById("tipoPrenda").value.trim();

    const obs=
    document.getElementById("obsCompra").value.trim();

    if(proveedor==""){

        alert("Ingrese el proveedor.");
        return;

    }

    if(grupo==""){

        alert("Seleccione el género.");
        return;

    }

    if(precio==""){

        alert("Ingrese el precio de compra.");
        return;

    }

    if(tipo==""){

        alert("Ingrese el tipo de prenda.");
        return;

    }

    grupoSeleccionado=grupo;

    localStorage.setItem("fechaCompra",fecha);
    localStorage.setItem("proveedor",proveedor);
    localStorage.setItem("marcaCompra",marca);
    localStorage.setItem("precioCompra",precio);
    localStorage.setItem("tipoPrenda",tipo);
    localStorage.setItem("obsCompra",obs);

    mostrarCantidades();

}

function mostrarCantidades(){

    ocultarPantallas();

    document.getElementById("pantallaCantidades").style.display="block";

    let talles=[];

    if(
        grupoSeleccionado=="BEBE" ||
        grupoSeleccionado=="BEBA" ||
        grupoSeleccionado=="UNISEX_BEBE"
    ){

        talles=["0","1","2","3","4","5","6"];

    }else{

        talles=["4","6","8","10","12","14","16"];

    }

    let html="";

    html+="<table class='tablaTalles'>";

    for(let i=0;i<talles.length;i++){

        html+="<tr>";

        html+="<td>";

        html+="Talle <b>"+talles[i]+"</b>";

        html+="</td>";

        html+="<td class='celdaCantidad'>";

        html+="<input";

        html+=" type='number'";

        html+=" min='0'";

        html+=" value='1'";

        html+=" data-talle='"+talles[i]+"'";

        html+=" class='cantidadTalle'>";

        html+="</td>";

        html+="</tr>";

    }

    html+="</table>";

    document.getElementById("listaCantidades").innerHTML=html;

}

function continuarCantidades(){

    const cantidades=[];
    const inputs=
    document.querySelectorAll(".cantidadTalle");

    inputs.forEach(function(input){

        const cantidad=
        Number(input.value);

        if(cantidad>0){

            cantidades.push({

                talle:input.dataset.talle,
                cantidad:cantidad

            });

        }

    });

    if(cantidades.length==0){

        alert("Debe ingresar al menos una cantidad.");

        return;

    }

    localStorage.setItem(
        "cantidadesCurva",
        JSON.stringify(cantidades)
    );

    mostrarResumen();

}

function mostrarResumen(){

    ocultarPantallas();

    document.getElementById("pantallaResumen").style.display="block";

    const cantidades=
    JSON.parse(localStorage.getItem("cantidadesCurva"));

    let html="";

    html+="<b>Proveedor:</b> ";
    html+=localStorage.getItem("proveedor");
    html+="<br>";

    html+="<b>Marca:</b> ";
    html+=(localStorage.getItem("marcaCompra")||"-");
    html+="<br>";

    html+="<b>Grupo:</b> ";
    html+=grupoSeleccionado;
    html+="<br>";

    html+="<b>Tipo:</b> ";
    html+=localStorage.getItem("tipoPrenda");
    html+="<br>";

    html+="<b>Precio compra:</b> $";
    html+=localStorage.getItem("precioCompra");

    html+="<hr>";

    cantidades.forEach(function(item){

        html+="Talle <b>";
        html+=item.talle;
        html+="</b>: ";
        html+=item.cantidad;
        html+=" unidad(es)<br>";

    });

    document.getElementById("datosResumen").innerHTML=html;

}

function iniciarCargaPrendas(){

    colaPrendas=[];

    const cantidades=
    JSON.parse(localStorage.getItem("cantidadesCurva"));

    cantidades.forEach(function(item){

        for(let i=0;i<item.cantidad;i++){

            colaPrendas.push(item.talle);

        }

    });

    indicePrenda=0;
    prendasGuardadas=[];

    mostrarFormularioPrenda();

}

function mostrarFormularioPrenda(){

    ocultarPantallas();

    document.getElementById("pantallaCarga").style.display="block";

    if(indicePrenda>=colaPrendas.length){

         enviarCompraCompleta();

        return;

    }

    const talle=
    colaPrendas[indicePrenda];

    document.getElementById("tituloCarga").innerHTML=

    "Prenda "+(indicePrenda+1)+" de "+colaPrendas.length;

    let html="";

    html+="<b>Talle:</b> ";
    html+=talle;

    html+="<br><br>";

    html+="<label>Color</label>";

    html+="<input";

    html+=" id='colorPrenda'";

    html+=" placeholder='Opcional'>";

    html+="<br><br>";

    html+="<button";

    html+=" class='verde'";

    html+=" onclick='guardarPrendaActual()'>";

    html+="Guardar y continuar";

    html+="</button>";

    document.getElementById("datosCarga").innerHTML=html;

}

function guardarPrendaActual(){

    const color =
    document.getElementById("colorPrenda").value.trim();

    const cola =
    JSON.parse(localStorage.getItem("colaPrendas"));

    let indice =
    Number(localStorage.getItem("indicePrenda"));

    let prendas =
    JSON.parse(localStorage.getItem("prendasCurva") || "[]");

    prendas.push({

        proveedor:localStorage.getItem("proveedor"),

        fecha:localStorage.getItem("fechaCompra"),

        grupo:grupoSeleccionado,

        tipo:localStorage.getItem("tipoPrenda"),

        marca:localStorage.getItem("marcaCompra"),

        precioCompra:localStorage.getItem("precioCompra"),

        talle:cola[indice],

        color:color

    });

    localStorage.setItem(

        "prendasCurva",

        JSON.stringify(prendas)

    );

    indice++;

    localStorage.setItem(

        "indicePrenda",

        indice

    );

    mostrarFormularioPrenda();

}
function enviarCompraCompleta(){

    const prendas =
    JSON.parse(localStorage.getItem("prendasCurva") || "[]");

    if(prendas.length==0){

        alert("No hay prendas para guardar.");

        return;

    }

    fetch(URL_SCRIPT,{

        method:"POST",

        body:new URLSearchParams({

            accion:"guardarCompra",

            prendas:JSON.stringify(prendas)

        })

    })

    .then(r=>r.json())

    .then(resp=>{

        if(resp.ok){

            localStorage.removeItem("prendasCurva");
            localStorage.removeItem("colaPrendas");
            localStorage.removeItem("indicePrenda");
            localStorage.removeItem("cantidadesCurva");
            localStorage.removeItem("tallesSeleccionados");

            finalizarCarga();

        }else{

            alert(resp.mensaje || "Error al guardar la compra.");

        }

    })

    .catch(()=>{

        alert("No fue posible conectar con el servidor.");

    });

}


function finalizarCarga(){

    let html="";

    html+="<h2>✅ Carga finalizada</h2>";

    html+="<p>";

    html+="Se cargaron <b>";

    html+=prendasGuardadas.length;

    html+="</b> prendas.";

    html+="</p>";

    html+="<button";

    html+=" class='verde'";

    html+=" onclick='enviarPrendasGoogle()'>";

    html+="Guardar definitivamente";

    html+="</button>";

    html+="<br>";

    html+="<button";

    html+=" class='gris'";

    html+=" onclick='volverMenu()'>";

    html+="Volver al menú";

    html+="</button>";

    document.getElementById("tituloCarga").innerHTML=
    "Proceso terminado";

    document.getElementById("datosCarga").innerHTML=html;

}

function enviarPrendasGoogle(){

    fetch(

        URL_SCRIPT,

        {

            method:"POST",

            headers:{

                "Content-Type":"application/json"

            },

            body:JSON.stringify({

                accion:"guardarCompra",

                prendas:prendasGuardadas

            })

        }

    )

    .then(r=>r.text())

    .then(function(res){

        alert("Compra guardada correctamente.");

        console.log(res);

        volverMenu();

    })

    .catch(function(err){

        console.error(err);

        alert("Error al guardar la compra.");

    });

}

function buscar(){

    const codigo=
    document.getElementById("codigo").value.trim();

    if(codigo==""){

        alert("Ingrese un código.");

        return;

    }

    fetch(

        URL_SCRIPT+
        "?accion=buscar&codigo="+
        encodeURIComponent(codigo)

    )

    .then(r=>r.json())

    .then(mostrar)

    .catch(function(){

        alert("Error de conexión.");

    });

}

function mostrar(p){

    if(!p){

        document.getElementById("resultado").innerHTML=

        "<div class='ficha'>Producto no encontrado.</div>";

        return;

    }

    let html="";

    html+="<div class='ficha'>";

    html+="<div class='nombre'>";

    html+=p.tipo||"";

    html+="</div>";

    html+="<div class='dato'><b>Código:</b> ";

    html+=p.codigo||"";

    html+="</div>";

    html+="<div class='dato'><b>Marca:</b> ";

    html+=p.marca||"";

    html+="</div>";

    html+="<div class='dato'><b>Precio:</b> $";

    html+=p.precio||"";

    html+="</div>";

    html+="<div class='dato'><b>Stock:</b> ";

    html+=p.stock||0;

    html+="</div>";

    html+="</div>";

    document.getElementById("resultado").innerHTML=html;

}

function iniciarCamara(){

    alert("La función de escaneo será incorporada nuevamente al finalizar la depuración del flujo de compras.");

}

</script>

</body>

</html>
