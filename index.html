<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Ropita de Cuento</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    padding:20px;
    background:#f3f3f3;
    font-family:Arial,Helvetica,sans-serif;

}

.card{

    max-width:720px;
    margin:auto;
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,.18);

}

h2,h3{

    margin-top:0;
    text-align:center;

}

label{

    display:block;
    margin-top:15px;
    font-weight:bold;

}

input,
select{

    width:100%;
    padding:14px;
    margin-top:8px;
    font-size:18px;

}

button{

    width:100%;
    padding:15px;
    margin-top:12px;
    font-size:20px;
    border:none;
    border-radius:8px;
    cursor:pointer;

}

.azul{

    background:#1976d2;
    color:white;

}

.verde{

    background:#43a047;
    color:white;

}

.gris{

    background:#757575;
    color:white;

}

.rojo{

    background:#c62828;
    color:white;

}

.ficha{

    border:1px solid #ddd;
    border-radius:10px;
    background:#fafafa;
    padding:15px;

}

.nombre{

    font-size:28px;
    color:#1565c0;
    font-weight:bold;
    margin-bottom:15px;

}

.dato{

    margin:8px 0;
    font-size:19px;

}

#reader{

    margin-top:20px;

}

.tablaTalles{

    width:100%;
    border-collapse:collapse;

}

.tablaTalles td{

    padding:10px;
    border-bottom:1px solid #ddd;

}

.celdaCantidad{

    width:90px;

}

.celdaCantidad input{

    text-align:center;

}

#menuPrincipal,
#pantallaBusqueda,
#pantallaNuevaCompra,
#pantallaTipoCarga,
#pantallaCantidades,
#pantallaResumen,
#pantallaCarga{

    display:none;

}

#menuPrincipal{

    display:block;

}

</style>

</head>

<body>

<div class="card">

<!-- ================= MENU ================= -->

<div id="menuPrincipal">

<h2>📦 ROPITA DE CUENTO</h2>

<button
class="azul"
onclick="abrirBusqueda()">

🔍 Buscar prenda

</button>

<button
class="verde"
onclick="abrirNuevaCompra()">

📦 Nueva compra

</button>

<button
class="gris">

🏷 Imprimir etiquetas

</button>

<button
class="gris">

📊 Inventario

</button>

<button
class="gris">

⚙ Configuración

</button>

</div>

<!-- ================= BUSQUEDA ================= -->

<div id="pantallaBusqueda">

<h2>Buscar prenda</h2>

<input
id="codigo"
placeholder="Escanear o escribir código">

<button
class="verde"
onclick="iniciarCamara()">

📷 Escanear

</button>

<button
class="azul"
onclick="buscar()">

Buscar

</button>

<div id="reader"></div>

<div id="resultado"></div>

<button
class="gris"
onclick="volverMenu()">

← Volver

</button>

</div>

<!-- ================= NUEVA COMPRA ================= -->

<div id="pantallaNuevaCompra">

<h2>Nueva compra</h2>

<label>Fecha</label>

<input
type="date"
id="fechaCompra">

<label>Proveedor</label>

<input
id="proveedor">

<label>Marca (opcional)</label>

<input
id="marcaCompra">

<label>Género</label>

<select
id="grupoCompra">

<option value="">Seleccione...</option>

<option value="BEBE">👶 Bebé</option>

<option value="BEBA">👧 Beba</option>

<option value="NENE">🧒 Nene</option>

<option value="NENA">👧 Nena</option>

<option value="UNISEX_BEBE">🍼 Unisex bebé</option>

<option value="UNISEX_NENE">👕 Unisex nene</option>

</select>

<label>Precio compra</label>

<input
id="precioCompra"
type="number">

<label>Tipo de prenda</label>

<select
id="tipoPrenda">

<option value="">Cargando...</option>

</select>

<label>Observaciones</label>

<input
id="obsCompra">

<button
class="verde"
onclick="crearCompra()">

Continuar

</button>

<button
class="gris"
onclick="volverMenu()">

← Volver

</button>

</div>

<!-- ================= TIPO DE CARGA ================= -->

<div id="pantallaTipoCarga">

<h2>¿Qué desea cargar?</h2>

<button
class="azul"
onclick="iniciarCargaIndividual()">

👕 Prenda individual

</button>

<button
class="verde"
onclick="mostrarCantidades()">

📦 Compra por curva

</button>

<button
class="gris"
onclick="volverNuevaCompra()">

← Volver

</button>

</div>

<!-- ================= CANTIDADES ================= -->

<div id="pantallaCantidades">

<h2>

Cantidad por talle

</h2>

<div
id="listaCantidades">

</div>

<button
class="verde"
onclick="continuarCantidades()">

Continuar

</button>

<button
class="gris"
onclick="volverTipoCarga()">

← Volver

</button>

</div>

<!-- ================= RESUMEN ================= -->

<div id="pantallaResumen">

<h2>

Resumen

</h2>

<div
id="datosResumen"
class="ficha">

</div>

<button
class="verde"
onclick="iniciarCargaPrendas()">

Comenzar carga

</button>

<button
class="gris"
onclick="volverCantidades()">

← Volver

</button>

</div>

<!-- ================= CARGA ================= -->

<div id="pantallaCarga">

<h2
id="tituloCarga">

Carga

</h2>

<div
id="datosCarga"
class="ficha">

</div>

<button
class="gris"
onclick="volverResumen()">

← Volver

</button>

</div>

</div>

<script>

<!-- ========================================= -->
<!-- NUEVA COMPRA -->
<!-- ========================================= -->

<div id="pantallaNuevaCompra">

<h2>Nueva compra</h2>

<label>Fecha</label>
<input type="date" id="fechaCompra">

<label>Proveedor</label>
<input id="proveedor" placeholder="Proveedor">

<label>Marca (opcional)</label>
<input id="marcaCompra" placeholder="Marca">

<label>Género</label>

<select id="grupoCompra">

<option value="">Seleccione...</option>

<option value="BEBE">👶 Bebé</option>
<option value="BEBA">👧 Beba</option>
<option value="NENE">🧒 Nene</option>
<option value="NENA">👧 Nena</option>
<option value="UNISEX_BEBE">🍼 Unisex bebé</option>
<option value="UNISEX_NENE">👕 Unisex nene</option>

</select>

<label>Tipo de prenda</label>

<select id="tipoPrenda">

<option value="">Seleccione...</option>

</select>

<label>Precio compra</label>

<input
id="precioCompra"
type="number"
step="0.01"
placeholder="0">

<label>Observaciones</label>

<input
id="obsCompra"
placeholder="Opcional">

<button
class="verde"
onclick="crearCompra()">

Continuar

</button>

<button
class="gris"
onclick="volverMenu()">

← Volver

</button>

</div>



<!-- ========================================= -->
<!-- CANTIDADES -->
<!-- ========================================= -->

<div id="pantallaCantidades">

<h2 id="tituloCantidades">

Cantidad por talle

</h2>

<div id="listaCantidades">

</div>

<button
class="verde"
onclick="continuarCantidades()">

Continuar

</button>

<button
class="gris"
onclick="volverNuevaCompra()">

← Volver

</button>

</div>



<!-- ========================================= -->
<!-- RESUMEN -->
<!-- ========================================= -->

<div id="pantallaResumen">

<h2>Resumen de compra</h2>

<div
id="datosResumen"
style="
background:#f5f5f5;
padding:15px;
border-radius:10px;
">

</div>

<button
class="verde"
onclick="iniciarCargaPrendas()">

Comenzar carga

</button>

<button
class="gris"
onclick="volverCantidades()">

← Volver

</button>

</div>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbwsBLmhm8xSx3vsfYEurnFM9m7D4S8WVLrGRBKRmnsx6uHLRAhEHMvzTUXlCW_kFnpC/exec";

let grupoSeleccionado="";
let colaPrendas=[];
let indicePrenda=0;
let prendasGuardadas=[];
let tiposPrenda=[];

window.onload=function(){

    volverMenu();

    cargarTipos();

};

function ocultarPantallas(){

    document.getElementById("menuPrincipal").style.display="none";
    document.getElementById("pantallaBusqueda").style.display="none";
    document.getElementById("pantallaNuevaCompra").style.display="none";
    document.getElementById("pantallaCantidades").style.display="none";
    document.getElementById("pantallaResumen").style.display="none";
    document.getElementById("pantallaCarga").style.display="none";

}

function volverMenu(){

    ocultarPantallas();

    document.getElementById("menuPrincipal").style.display="block";

}

function abrirBusqueda(){

    ocultarPantallas();

    document.getElementById("pantallaBusqueda").style.display="block";

}

function abrirNuevaCompra(){

    ocultarPantallas();

    document.getElementById("pantallaNuevaCompra").style.display="block";

    const hoy=new Date();

    document.getElementById("fechaCompra").value=

    hoy.toISOString().substring(0,10);

}

function volverNuevaCompra(){

    ocultarPantallas();

    document.getElementById("pantallaNuevaCompra").style.display="block";

}

function volverCantidades(){

    ocultarPantallas();

    document.getElementById("pantallaCantidades").style.display="block";

}

function volverResumen(){

    ocultarPantallas();

    document.getElementById("pantallaResumen").style.display="block";

}

function cargarTipos(){

    fetch(

        URL_SCRIPT+"?accion=tipos"

    )

    .then(r=>r.json())

    .then(function(lista){

        tiposPrenda=lista;

        const combo=

        document.getElementById("tipoPrenda");

        combo.innerHTML="";

        combo.innerHTML+=

        "<option value=''>Seleccione...</option>";

        lista.forEach(function(t){

            combo.innerHTML+=

            "<option value='"+t.codigo+"'>"+

            t.nombre+

            "</option>";

        });

    });

}

function crearCompra(){

    const proveedor=

    document.getElementById("proveedor").value.trim();

    if(proveedor==""){

        alert("Ingrese el proveedor.");

        return;

    }

    grupoSeleccionado=

    document.getElementById("grupoCompra").value;

    if(grupoSeleccionado==""){

        alert("Seleccione el género.");

        return;

    }

    if(document.getElementById("tipoPrenda").value==""){

        alert("Seleccione el tipo de prenda.");

        return;

    }

    if(document.getElementById("precioCompra").value==""){

        alert("Ingrese el precio.");

        return;

    }

    localStorage.setItem(

        "proveedor",

        proveedor

    );

    localStorage.setItem(

        "fechaCompra",

        document.getElementById("fechaCompra").value

    );

    localStorage.setItem(

        "marcaCompra",

        document.getElementById("marcaCompra").value.trim()

    );

    localStorage.setItem(

        "precioCompra",

        document.getElementById("precioCompra").value

    );

    localStorage.setItem(

        "tipoCodigo",

        document.getElementById("tipoPrenda").value

    );

    localStorage.setItem(

        "tipoNombre",

        document.getElementById("tipoPrenda").selectedOptions[0].text

    );

    localStorage.setItem(

        "obsCompra",

        document.getElementById("obsCompra").value.trim()

    );

    mostrarCantidades();

}

function mostrarCantidades(){

    ocultarPantallas();

    document.getElementById("pantallaCantidades").style.display="block";

    let talles=[];

    if(
        grupoSeleccionado=="BEBE" ||
        grupoSeleccionado=="BEBA" ||
        grupoSeleccionado=="UNISEX_BEBE"
    ){

        talles=["0","1","2","3","4","5","6"];

    }else{

        talles=["4","6","8","10","12","14","16"];

    }

    let html="";

    html+="<table class='tablaTalles'>";

    talles.forEach(function(t){

        html+="<tr>";

        html+="<td><b>Talle "+t+"</b></td>";

        html+="<td class='celdaCantidad'>";

        html+="<input";

        html+=" class='cantidadTalle'";

        html+=" data-talle='"+t+"'";

        html+=" type='number'";

        html+=" value='1'";

        html+=" min='0'>";

        html+="</td>";

        html+="</tr>";

    });

    html+="</table>";

    document.getElementById("listaCantidades").innerHTML=html;

}



function continuarCantidades(){

    let cantidades=[];

    document.querySelectorAll(".cantidadTalle")

    .forEach(function(c){

        let cant=Number(c.value);

        if(cant>0){

            cantidades.push({

                talle:c.dataset.talle,

                cantidad:cant

            });

        }

    });

    if(cantidades.length==0){

        alert("Debe ingresar al menos una cantidad.");

        return;

    }

    localStorage.setItem(

        "cantidadesCurva",

        JSON.stringify(cantidades)

    );

    mostrarResumen();

}



function mostrarResumen(){

    ocultarPantallas();

    document.getElementById("pantallaResumen").style.display="block";

    const cantidades=

    JSON.parse(localStorage.getItem("cantidadesCurva"));

    let html="";

    html+="<b>Proveedor:</b> ";

    html+=localStorage.getItem("proveedor");

    html+="<br>";

    html+="<b>Marca:</b> ";

    html+=localStorage.getItem("marcaCompra")||"-";

    html+="<br>";

    html+="<b>Grupo:</b> ";

    html+=grupoSeleccionado;

    html+="<br>";

    html+="<b>Tipo:</b> ";

    html+=localStorage.getItem("tipoNombre");

    html+="<br>";

    html+="<b>Precio:</b> $";

    html+=localStorage.getItem("precioCompra");

    html+="<hr>";

    cantidades.forEach(function(t){

        html+="Talle <b>";

        html+=t.talle;

        html+="</b> : ";

        html+=t.cantidad;

        html+=" unidad(es)<br>";

    });

    document.getElementById("datosResumen").innerHTML=html;

}



function iniciarCargaPrendas(){

    colaPrendas=[];

    indicePrenda=0;

    prendasGuardadas=[];

    const cantidades=

    JSON.parse(localStorage.getItem("cantidadesCurva"));

    cantidades.forEach(function(t){

        for(let i=0;i<t.cantidad;i++){

            colaPrendas.push(t.talle);

        }

    });

    mostrarFormularioPrenda();

}



function mostrarFormularioPrenda(){

    ocultarPantallas();

    document.getElementById("pantallaCarga").style.display="block";

    if(indicePrenda>=colaPrendas.length){

        enviarCompraCompleta();

        return;

    }

    let talle=

    colaPrendas[indicePrenda];

    document.getElementById("tituloCarga").innerHTML=

    "Prenda "+(indicePrenda+1)+" de "+colaPrendas.length;

    let html="";

    html+="<b>Talle:</b> ";

    html+=talle;

    html+="<br><br>";

    html+="<label>Color</label>";

    html+="<input";

    html+=" id='colorPrenda'";

    html+=" placeholder='Opcional'>";

    html+="<br><br>";

    html+="<button";

    html+=" class='verde'";

    html+=" onclick='guardarPrendaActual()'>";

    html+="Guardar y continuar";

    html+="</button>";

    document.getElementById("datosCarga").innerHTML=html;

}



function guardarPrendaActual(){

    prendasGuardadas.push({

        talle:colaPrendas[indicePrenda],

        color:document.getElementById("colorPrenda").value.trim()

    });

    indicePrenda++;

    mostrarFormularioPrenda();

}
function enviarCompraCompleta(){

    fetch(

        URL_SCRIPT,

        {

            method:"POST",

            body:new URLSearchParams({

                accion:"guardarCompra",

                proveedor:localStorage.getItem("proveedor"),

                fecha:localStorage.getItem("fechaCompra"),

                marca:localStorage.getItem("marcaCompra"),

                genero:grupoSeleccionado,

                tipoCodigo:localStorage.getItem("tipoCodigo"),

                tipoNombre:localStorage.getItem("tipoNombre"),

                precioCompra:localStorage.getItem("precioCompra"),

                observaciones:localStorage.getItem("obsCompra"),

                prendas:JSON.stringify(prendasGuardadas)

            })

        }

    )

    .then(r=>r.json())

    .then(function(resp){

        if(resp.ok){

            finalizarCarga();

        }else{

            alert(resp.mensaje || "Error al guardar la compra.");

        }

    })

    .catch(function(){

        alert("No fue posible conectar con el servidor.");

    });

}



function finalizarCarga(){

    localStorage.clear();

    colaPrendas=[];

    prendasGuardadas=[];

    indicePrenda=0;

    ocultarPantallas();

    document.getElementById("pantallaCarga").style.display="block";

    document.getElementById("tituloCarga").innerHTML=

    "Proceso terminado";

    document.getElementById("datosCarga").innerHTML=

    "<h2>✅ Compra guardada correctamente</h2>"+

    "<br>"+

    "<button class='verde' onclick='volverMenu()'>Volver al menú</button>";

}



function buscar(){

    const codigo=

    document.getElementById("codigo").value.trim();

    if(codigo==""){

        alert("Ingrese un código.");

        return;

    }

    fetch(

        URL_SCRIPT+

        "?accion=buscar&codigo="+

        encodeURIComponent(codigo)

    )

    .then(r=>r.json())

    .then(mostrar)

    .catch(function(){

        alert("Error de conexión.");

    });

}



function mostrar(p){

    if(!p){

        document.getElementById("resultado").innerHTML=

        "<div class='ficha'><h3>Producto no encontrado</h3></div>";

        return;

    }

    let html="";

    html+="<div class='ficha'>";

    html+="<div class='nombre'>";

    html+=p.subcategoria || "";

    html+="</div>";

    html+="<div class='dato'><b>Código:</b> ";

    html+=p.codigo;

    html+="</div>";

    html+="<div class='dato'><b>Talle:</b> ";

    html+=p.talle;

    html+="</div>";

    html+="<div class='dato'><b>Color:</b> ";

    html+=p.color;

    html+="</div>";

    html+="<div class='dato'><b>Precio:</b> $";

    html+=p.precioVenta;

    html+="</div>";

    html+="<div class='dato'><b>Estado:</b> ";

    html+=p.estado;

    html+="</div>";

    html+="</div>";

    document.getElementById("resultado").innerHTML=html;

}



function iniciarCamara(){

    document.getElementById("reader").innerHTML="";

    const lector=new Html5Qrcode("reader");

    lector.start(

        { facingMode:"environment" },

        {

            fps:10,

            qrbox:{ width:260,height:110 }

        },

        function(texto){

            document.getElementById("codigo").value=texto;

            lector.stop().then(function(){

                buscar();

            });

        },

        function(){}

    );

}
