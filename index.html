<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<base target="_top">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  font-family:Arial,sans-serif;
  background:#f3f3f3;
  margin:0;
  padding:15px;
}

.card{
  max-width:550px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}

h2{
  text-align:center;
  margin-top:0;
}

label{
  display:block;
  margin-top:12px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  margin-top:5px;
  font-size:16px;
  box-sizing:border-box;
  border-radius:6px;
  border:1px solid #ccc;
}

textarea{
  min-height:80px;
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  margin-top:15px;
  font-size:18px;
  border:0;
  border-radius:8px;
  background:#43a047;
  color:white;
  cursor:pointer;
}

button.secundario{
  background:#1976d2;
}

button.rojo{
  background:#d32f2f;
}

button.gris{
  background:#757575;
}

.pantalla{
  display:none;
}

.item{
  background:#eeeeee;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
}

#reader{
  margin-top:20px;
}

.resultado{
  margin-top:20px;
  font-size:18px;
  line-height:1.7;
}

.mensaje{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  background:#eeeeee;
}

.cargando{
  text-align:center;
  color:#666;
  margin-top:10px;
}

</style>

</head>

<body>

<!-- ===================================================== -->

<!-- MENU PRINCIPAL -->

<!-- ===================================================== -->

<div id="menuPrincipal" class="pantalla">

<div class="card">

<h2>📦 ROPITA DE CUENTO</h2>

<button onclick="nuevaCompra()">
🛒 Nueva compra
</button>

<button class="secundario"
onclick="buscarInventario()">
🔎 Buscar producto </button>

</div>

</div>

<!-- ===================================================== -->

<!-- NUEVA COMPRA -->

<!-- ===================================================== -->

<div id="pantallaNuevaCompra" class="pantalla">

<div class="card">

<h2>🛒 Nueva Compra</h2>

<label>Proveedor</label>

<select id="proveedor">
<option value="">Cargando proveedores...</option>
</select>

<button
class="secundario"
onclick="nuevoProveedor()">
🏪 Nuevo proveedor </button>

<label>Fecha</label>

<input
type="date"
id="fechaCompra">

<label>Observaciones</label>

<textarea id="obsCompra"></textarea>

<button onclick="continuarCarga()">
➡️ Continuar
</button>

<button
class="rojo"
onclick="volverMenu()">
⬅️ Volver </button>

</div>

</div>

<!-- ===================================================== -->

<!-- NUEVO PROVEEDOR -->

<!-- ===================================================== -->

<div id="pantallaProveedor" class="pantalla">

<div class="card">

<h2>🏪 Nuevo Proveedor</h2>

<label>Nombre</label> <input id="provNombre">

<label>Teléfono</label> <input id="provTelefono">

<label>WhatsApp</label> <input id="provWhatsapp">

<label>Dirección</label> <input id="provDireccion">

<label>Ciudad</label> <input id="provCiudad">

<label>Galería</label> <input id="provGaleria">

<label>Local</label> <input id="provLocal">

<label>Instagram</label> <input id="provInstagram">

<label>Observaciones</label>

<textarea id="provObs"></textarea>

<button onclick="guardarProveedor()">
💾 Guardar proveedor
</button>

<button
class="rojo"
onclick="volverNuevaCompra()">
❌ Cancelar </button>

</div>

</div>

<!-- ===================================================== -->

<!-- CARGAR PRENDAS -->

<!-- ===================================================== -->

<div id="pantallaCarga" class="pantalla">

<div class="card">

<h2>👕 Cargar prendas</h2>

<label>Género</label>

<select
id="genero"
onchange="cargarCategorias()"> </select>

<label>Categoría</label>

<select
id="categoria"
onchange="cargarSubcategorias()"> </select>

<label>Subcategoría</label>

<select
id="subcategoria"> </select>

<label>Talle</label>

<input
id="talle"
placeholder="Ej: TALLE 8">

<label>Color</label>

<select id="color">
</select>

<label>Diseño</label>

<input id="diseno">

<label>Precio compra</label>

<input
type="number"
id="precioCompra"
step="0.01">

<label>Precio venta</label>

<input
type="number"
id="precioVenta"
step="0.01">

<label>Observaciones</label>

<textarea
id="obsProducto"></textarea>

<button onclick="agregarPrenda()">
➕ Agregar prenda
</button>

<div id="listaPrendas"></div>

<button
class="secundario"
onclick="mostrarResumen()">
📋 Ver resumen </button>

<button
class="rojo"
onclick="volverNuevaCompra()">
⬅️ Volver </button>

</div>

</div>

<!-- ===================================================== -->

<!-- RESUMEN -->

<!-- ===================================================== -->

<div id="pantallaResumen" class="pantalla">

<div class="card">

<h2>📋 Resumen de compra</h2>

<div id="resumenCompra"></div>

<button onclick="guardarCompra()">
💾 Confirmar guardado
</button>

<button
class="rojo"
onclick="volverCarga()">
⬅️ Volver </button>

</div>

</div>

<!-- ===================================================== -->

<!-- BUSCAR PRODUCTO -->

<!-- ===================================================== -->

<div id="pantallaBusqueda" class="pantalla">

<div class="card">

<h2>🔎 Buscar producto</h2>

<input
id="codigoBusqueda"
placeholder="Código interno o código de barras">

<button
class="secundario"
onclick="iniciarCamaraBusqueda()">
📷 Escanear </button>

<button onclick="buscarProductoGitHub()">
🔎 Buscar
</button>

<div id="readerBusqueda"></div>

<div
id="resultadoBusqueda"
class="resultado">
</div>

<button
class="rojo"
onclick="volverMenu()">
⬅️ Volver </button>

</div>

</div>

<script>


/* ===================================================== */
/* CONFIGURACIÓN */
/* ===================================================== */

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbwsBLmhm8xSx3vsfYEurnFM9m7D4S8WVLrGRBKRmnsx6uHLRAhEHMvzTUXlCW_kFnpC/exec";


let prendas=[];

let scannerBusqueda=null;


/* ===================================================== */
/* INICIO */
/* ===================================================== */

window.onload=function(){

  iniciar();

};


function iniciar(){

  ocultarPantallas();

  document.getElementById(
    "menuPrincipal"
  ).style.display="block";

  establecerFecha();

  cargarProveedores();

}


function establecerFecha(){

  const campo=
    document.getElementById("fechaCompra");

  if(!campo)return;

  const hoy=new Date();

  const yyyy=hoy.getFullYear();

  const mm=String(
    hoy.getMonth()+1
  ).padStart(2,"0");

  const dd=String(
    hoy.getDate()
  ).padStart(2,"0");

  campo.value=
    yyyy+"-"+mm+"-"+dd;

}


/* ===================================================== */
/* PANTALLAS */
/* ===================================================== */

function ocultarPantallas(){

  [
    "menuPrincipal",
    "pantallaNuevaCompra",
    "pantallaProveedor",
    "pantallaCarga",
    "pantallaResumen",
    "pantallaBusqueda"
  ].forEach(function(id){

    const el=
      document.getElementById(id);

    if(el){
      el.style.display="none";
    }

  });

}


function mostrarPantalla(id){

  ocultarPantallas();

  const el=
    document.getElementById(id);

  if(el){
    el.style.display="block";
  }

}


function volverMenu(){

  mostrarPantalla(
    "menuPrincipal"
  );

}


function nuevaCompra(){

  mostrarPantalla(
    "pantallaNuevaCompra"
  );

  cargarProveedores();

}


function nuevoProveedor(){

  mostrarPantalla(
    "pantallaProveedor"
  );

}


function volverNuevaCompra(){

  mostrarPantalla(
    "pantallaNuevaCompra"
  );

  cargarProveedores();

}


function volverCarga(){

  mostrarPantalla(
    "pantallaCarga"
  );

}


/* ===================================================== */
/* PROVEEDORES */
/* ===================================================== */

function cargarProveedores(){

  fetch(
    URL_SCRIPT+
    "?accion=proveedores"
  )

  .then(function(r){

    return r.json();

  })

  .then(function(lista){

    const combo=
      document.getElementById(
        "proveedor"
      );

    if(!combo)return;

    combo.innerHTML=
      '<option value="">Seleccione proveedor</option>';

    if(!Array.isArray(lista)){
      return;
    }

    lista.forEach(function(p){

      combo.innerHTML+=
        '<option value="'+
        escapeHtml(p.nombre)+
        '">'+
        escapeHtml(p.nombre)+
        '</option>';

    });

  })

  .catch(function(error){

    console.error(
      "Error proveedores:",
      error
    );

  });

}


function guardarProveedor(){

  const proveedor={

    nombre:
      document.getElementById(
        "provNombre"
      ).value.trim(),

    telefono:
      document.getElementById(
        "provTelefono"
      ).value.trim(),

    whatsapp:
      document.getElementById(
        "provWhatsapp"
      ).value.trim(),

    direccion:
      document.getElementById(
        "provDireccion"
      ).value.trim(),

    ciudad:
      document.getElementById(
        "provCiudad"
      ).value.trim(),

    galeria:
      document.getElementById(
        "provGaleria"
      ).value.trim(),

    local:
      document.getElementById(
        "provLocal"
      ).value.trim(),

    instagram:
      document.getElementById(
        "provInstagram"
      ).value.trim(),

    observaciones:
      document.getElementById(
        "provObs"
      ).value.trim()

  };


  if(proveedor.nombre===""){

    alert(
      "Ingrese el nombre del proveedor."
    );

    return;

  }


  fetch(
    URL_SCRIPT,
    {
      method:"POST",

      headers:{
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:JSON.stringify({

        accion:
          "guardarProveedor",

        proveedor:
          proveedor

      })

    }
  )

  .then(function(response){

    return response.json();

  })

  .then(function(resp){

    if(resp.ok){

      alert(
        resp.mensaje ||
        "Proveedor guardado correctamente."
      );

      limpiarProveedor();

      volverNuevaCompra();

    }else{

      alert(
        resp.mensaje ||
        "No se pudo guardar el proveedor."
      );

    }

  })

  .catch(function(error){

    console.error(error);

    alert(
      "Error al guardar proveedor."
    );

  });

}


function limpiarProveedor(){

  [
    "provNombre",
    "provTelefono",
    "provWhatsapp",
    "provDireccion",
    "provCiudad",
    "provGaleria",
    "provLocal",
    "provInstagram",
    "provObs"

  ].forEach(function(id){

    const campo=
      document.getElementById(id);

    if(campo){
      campo.value="";
    }

  });

}


/* ===================================================== */
/* CONTINUAR CARGA */
/* ===================================================== */

function continuarCarga(){

  const proveedor=
    document.getElementById(
      "proveedor"
    ).value;

  if(!proveedor){

    alert(
      "Seleccione un proveedor."
    );

    return;

  }


  mostrarPantalla(
    "pantallaCarga"
  );


  prendas=[];

  mostrarPrendas();

  cargarGeneros();

  cargarColores();

}


/* ===================================================== */
/* GENEROS */
/* ===================================================== */

function cargarGeneros(){

  const combo=
    document.getElementById(
      "genero"
    );

  combo.innerHTML=
    "<option>Cargando...</option>";


  fetch(
    URL_SCRIPT+
    "?accion=generos"
  )

  .then(function(r){

    return r.json();

  })

  .then(function(lista){

    combo.innerHTML="";

    if(!Array.isArray(lista)){
      return;
    }

    lista.forEach(function(g){

      combo.innerHTML+=
        '<option value="'+
        escapeHtml(g.codigo)+
        '">'+
        escapeHtml(g.nombre)+
        '</option>';

    });


    if(lista.length>0){

      cargarCategorias();

    }

  })

  .catch(function(error){

    console.error(error);

    combo.innerHTML=
      "<option>Error</option>";

  });

}


/* ===================================================== */
/* CATEGORIAS */
/* ===================================================== */

function cargarCategorias(){

  const combo=
    document.getElementById(
      "categoria"
    );

  combo.innerHTML=
    "<option>Cargando...</option>";


  fetch(
    URL_SCRIPT+
    "?accion=categorias"
  )

  .then(function(r){

    return r.json();

  })

  .then(function(lista){

    combo.innerHTML="";

    if(!Array.isArray(lista)){
      return;
    }

    lista.forEach(function(c){

      combo.innerHTML+=
        '<option value="'+
        escapeHtml(c.codigo)+
        '">'+
        escapeHtml(c.nombre)+
        '</option>';

    });


    if(lista.length>0){

      cargarSubcategorias();

    }

  })

  .catch(function(error){

    console.error(error);

  });

}


/* ===================================================== */
/* SUBCATEGORIAS */
/* ===================================================== */

function cargarSubcategorias(){

  const categoria=
    document.getElementById(
      "categoria"
    ).value;


  const combo=
    document.getElementById(
      "subcategoria"
    );


  combo.innerHTML=
    "<option>Cargando...</option>";


  fetch(
    URL_SCRIPT+
    "?accion=subcategorias&categoria="+
    encodeURIComponent(categoria)
  )

  .then(function(r){

    return r.json();

  })

  .then(function(lista){

    combo.innerHTML="";

    if(!Array.isArray(lista)){
      return;
    }

    lista.forEach(function(s){

      combo.innerHTML+=
        '<option value="'+
        escapeHtml(s.codigo)+
        '">'+
        escapeHtml(s.nombre)+
        '</option>';

    });

  })

  .catch(function(error){

    console.error(error);

    combo.innerHTML=
      "<option>Error</option>";

  });

}


/* ===================================================== */
/* COLORES */
/* ===================================================== */

function cargarColores(){

  const combo=
    document.getElementById(
      "color"
    );

  combo.innerHTML=
    "<option>Cargando...</option>";


  fetch(
    URL_SCRIPT+
    "?accion=colores"
  )

  .then(function(r){

    return r.json();

  })

  .then(function(lista){

    combo.innerHTML="";

    if(!Array.isArray(lista)){
      return;
    }

    lista.forEach(function(c){

      combo.innerHTML+=
        '<option value="'+
        escapeHtml(c.nombre)+
        '">'+
        escapeHtml(c.nombre)+
        '</option>';

    });

  })

  .catch(function(error){

    console.error(error);

  });

}


/* ===================================================== */
/* PRENDAS */
/* ===================================================== */

function agregarPrenda(){

  const genero=
    document.getElementById(
      "genero"
    ).value;

  const categoria=
    document.getElementById(
      "categoria"
    ).value;

  const subcategoria=
    document.getElementById(
      "subcategoria"
    ).value;

  const talle=
    document.getElementById(
      "talle"
    ).value.trim();

  const color=
    document.getElementById(
      "color"
    ).value;

  const diseno=
    document.getElementById(
      "diseno"
    ).value.trim();

  const precioCompra=
    document.getElementById(
      "precioCompra"
    ).value;

  const precioVenta=
    document.getElementById(
      "precioVenta"
    ).value;

  const observaciones=
    document.getElementById(
      "obsProducto"
    ).value.trim();


  if(!genero ||
     !categoria ||
     !subcategoria ||
     !talle){

    alert(
      "Complete género, categoría, subcategoría y talle."
    );

    return;

  }


  const p={

    genero:genero,

    categoria:categoria,

    subcategoria:subcategoria,

    talle:talle,

    color:color,

    diseno:diseno,

    precioCompra:precioCompra,

    precioVenta:precioVenta,

    observaciones:observaciones

  };


  prendas.push(p);


  mostrarPrendas();


  limpiarCamposPrenda();

}


function limpiarCamposPrenda(){

  document.getElementById(
    "talle"
  ).value="";

  document.getElementById(
    "diseno"
  ).value="";

  document.getElementById(
    "precioCompra"
  ).value="";

  document.getElementById(
    "precioVenta"
  ).value="";

  document.getElementById(
    "obsProducto"
  ).value="";

}


function mostrarPrendas(){

  const div=
    document.getElementById(
      "listaPrendas"
    );


  div.innerHTML="";


  if(prendas.length===0){

    div.innerHTML=
      '<div class="mensaje">'+
      'Todavía no hay prendas cargadas.'+
      '</div>';

    return;

  }


  prendas.forEach(function(p,i){

    div.innerHTML+=

      '<div class="item">'+

      '<b>'+
      (i+1)+
      '. '+
      escapeHtml(p.genero)+
      ' - '+
      escapeHtml(p.categoria)+
      ' - '+
      escapeHtml(p.subcategoria)+
      '</b>'+

      '<br>Talle: '+
      escapeHtml(p.talle)+

      '<br>Color: '+
      escapeHtml(p.color)+

      '<br>Precio compra: $'+
      escapeHtml(p.precioCompra)+

      '<br>Precio venta: $'+
      escapeHtml(p.precioVenta)+

      '</div>';

  });

}


/* ===================================================== */
/* RESUMEN */
/* ===================================================== */

function mostrarResumen(){

  if(prendas.length===0){

    alert(
      "No hay prendas cargadas."
    );

    return;

  }


  const div=
    document.getElementById(
      "resumenCompra"
    );


  div.innerHTML="";


  prendas.forEach(function(p,i){

    div.innerHTML+=

      '<div class="item">'+

      '<b>Prenda '+
      (i+1)+
      '</b>'+

      '<br>Género: '+
      escapeHtml(p.genero)+

      '<br>Categoría: '+
      escapeHtml(p.categoria)+

      '<br>Subcategoría: '+
      escapeHtml(p.subcategoria)+

      '<br>Talle: '+
      escapeHtml(p.talle)+

      '<br>Color: '+
      escapeHtml(p.color)+

      '<br>Diseño: '+
      escapeHtml(p.diseno)+

      '<br>Precio compra: $'+
      escapeHtml(p.precioCompra)+

      '<br>Precio venta: $'+
      escapeHtml(p.precioVenta)+

      '</div>';

  });


  mostrarPantalla(
    "pantallaResumen"
  );

}


/* ===================================================== */
/* GUARDAR COMPRA */
/* ===================================================== */

function guardarCompra(){

  if(prendas.length===0){

    alert(
      "No hay prendas cargadas."
    );

    return;

  }


  const compra={

    fecha:
      document.getElementById(
        "fechaCompra"
      ).value,

    proveedor:
      document.getElementById(
        "proveedor"
      ).value,

    observaciones:
      document.getElementById(
        "obsCompra"
      ).value

  };


  if(!compra.proveedor){

    alert(
      "Seleccione un proveedor."
    );

    return;

  }


  fetch(
    URL_SCRIPT,
    {

      method:"POST",

      headers:{
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:JSON.stringify({

        accion:
          "guardarCompra",

        compra:
          compra,

        prendas:
          prendas

      })

    }
  )

  .then(function(r){

    return r.json();

  })

  .then(function(resp){

    if(resp.ok){

      alert(
        resp.mensaje ||
        "Compra guardada correctamente."
      );


      prendas=[];

      mostrarPrendas();


      document.getElementById(
        "obsCompra"
      ).value="";


      nuevaCompra();

    }else{

      alert(
        resp.mensaje ||
        "No se pudo guardar la compra."
      );

    }

  })

  .catch(function(error){

    console.error(error);

    alert(
      "Error al guardar la compra."
    );

  });

}


/* ===================================================== */
/* BUSQUEDA */
/* ===================================================== */

function buscarInventario(){

  mostrarPantalla(
    "pantallaBusqueda"
  );

}


function buscarProductoGitHub(){

  const codigo=
    document.getElementById(
      "codigoBusqueda"
    ).value.trim();


  if(!codigo){

    alert(
      "Ingrese o escanee un código."
    );

    return;

  }


  const resultado=
    document.getElementById(
      "resultadoBusqueda"
    );


  resultado.innerHTML=
    '<div class="cargando">'+
    'Buscando...'+
    '</div>';


  fetch(
    URL_SCRIPT+
    "?codigo="+
    encodeURIComponent(codigo)
  )

  .then(function(r){

    return r.json();

  })

  .then(function(p){

    mostrarProducto(p);

  })

  .catch(function(error){

    console.error(error);

    resultado.innerHTML=
      '<div class="mensaje">'+
      'Error al consultar el producto.'+
      '</div>';

  });

}


function mostrarProducto(p){

  const resultado=
    document.getElementById(
      "resultadoBusqueda"
    );


  if(!p){

    resultado.innerHTML=
      '<div class="mensaje">'+
      '<h3>Producto no encontrado</h3>'+
      '</div>';

    return;

  }


  resultado.innerHTML=

    '<div class="item">'+

    '<h3>📦 Producto encontrado</h3>'+

    '<b>Código:</b> '+
    escapeHtml(p.codigo)+
    '<br>'+

    '<b>Código de barras:</b> '+
    escapeHtml(p.codigoBarras)+
    '<br>'+

    '<b>Género:</b> '+
    escapeHtml(p.genero)+
    '<br>'+

    '<b>Categoría:</b> '+
    escapeHtml(p.categoria)+
    '<br>'+

    '<b>Subcategoría:</b> '+
    escapeHtml(p.subcategoria)+
    '<br>'+

    '<b>Talle:</b> '+
    escapeHtml(p.talle)+
    '<br>'+

    '<b>Color:</b> '+
    escapeHtml(p.color)+
    '<br>'+

    '<b>Diseño:</b> '+
    escapeHtml(p.diseño)+
    '<br>'+

    '<b>Precio compra:</b> $'+
    escapeHtml(p.precioCompra)+
    '<br>'+

    '<b>Precio venta:</b> $'+
    escapeHtml(p.precioVenta)+
    '<br>'+

    '<b>Estado:</b> '+
    escapeHtml(p.estado)+

    '</div>';

}


/* ===================================================== */
/* ESCANER */
/* ===================================================== */

function iniciarCamaraBusqueda(){

  const reader=
    document.getElementById(
      "readerBusqueda"
    );


  reader.innerHTML="";


  if(typeof Html5Qrcode==="undefined"){

    alert(
      "No se pudo cargar el lector de códigos."
    );

    return;

  }


  scannerBusqueda=
    new Html5Qrcode(
      "readerBusqueda"
    );


  scannerBusqueda.start(

    {
      facingMode:{
        ideal:"environment"
      }
    },

    {
      fps:10,

      qrbox:{
        width:280,
        height:120
      },

      formatsToSupport:[

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    },

    function(codigo){

      document.getElementById(
        "codigoBusqueda"
      ).value=codigo;


      if(scannerBusqueda){

        scannerBusqueda
          .stop()
          .then(function(){

            reader.innerHTML="";

            buscarProductoGitHub();

          })
          .catch(function(){

            buscarProductoGitHub();

          });

      }else{

        buscarProductoGitHub();

      }

    },

    function(error){

      // Los errores de lectura son normales
      // mientras la cámara está buscando.

    }

  )

  .catch(function(error){

    console.error(error);

    alert(
      "No se pudo iniciar la cámara: "+
      error
    );

  });

}


/* ===================================================== */
/* SEGURIDAD HTML */
/* ===================================================== */

function escapeHtml(valor){

  if(valor===null ||
     valor===undefined){

    return "";

  }


  return String(valor)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}
