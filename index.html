<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ropita de Cuento</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#f3f3f3;
    font-family:Arial,Helvetica,sans-serif;
}

.card{
    max-width:760px;
    margin:auto;
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,.20);
}

h2,h3{
    margin-top:0;
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:14px;
    margin-top:8px;
    font-size:18px;
}

button{
    width:100%;
    padding:15px;
    margin-top:12px;
    font-size:20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.azul{
    background:#1976d2;
    color:white;
}

.verde{
    background:#43a047;
    color:white;
}

.gris{
    background:#757575;
    color:white;
}

.rojo{
    background:#c62828;
    color:white;
}

.ficha{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
}

.nombre{
    font-size:28px;
    font-weight:bold;
    color:#1565c0;
    margin-bottom:12px;
}

.dato{
    font-size:19px;
    margin:8px 0;
}

.tablaTalles{
    width:100%;
    border-collapse:collapse;
}

.tablaTalles td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.celdaCantidad{
    width:100px;
}

.celdaCantidad input{
    text-align:center;
}

#reader{
    margin-top:20px;
}

#menuPrincipal,
#pantallaBusqueda,
#pantallaNuevaCompra,
#pantallaTipoCarga,
#pantallaCantidades,
#pantallaResumen,
#pantallaCarga{
    display:none;
}

#menuPrincipal{
    display:block;
}

</style>

</head>

<body>

<div class="card">

<!-- ===================================================== -->
<!-- MENU PRINCIPAL -->
<!-- ===================================================== -->

<div id="menuPrincipal">

<h2>📦 ROPITA DE CUENTO</h2>

<button
class="azul"
onclick="abrirBusqueda()">

🔍 Buscar prenda

</button>

<button
class="verde"
onclick="abrirNuevaCompra()">

📦 Nueva compra

</button>

<button
class="gris"
onclick="alert('Próximamente')">

🏷 Imprimir etiquetas

</button>

<button
class="gris"
onclick="alert('Próximamente')">

📊 Inventario

</button>

<button
class="gris"
onclick="alert('Próximamente')">

⚙ Configuración

</button>

</div>

<!-- ===================================================== -->
<!-- BUSQUEDA -->
<!-- ===================================================== -->

<div id="pantallaBusqueda">

<h2>Buscar prenda</h2>

<input
id="codigo"
placeholder="Escanear o escribir código">

<button
class="verde"
onclick="iniciarCamara()">

📷 Escanear

</button>

<button
class="azul"
onclick="buscar()">

Buscar

</button>

<div id="reader"></div>

<div id="resultado"></div>

<button
class="gris"
onclick="volverMenu()">

← Volver

</button>

</div>

<!-- ===================================================== -->
<!-- NUEVA COMPRA -->
<!-- ===================================================== -->

<div id="pantallaNuevaCompra">

<h2>Nueva compra</h2>

<label>Fecha</label>

<input
type="date"
id="fechaCompra">

<label>Proveedor</label>

<select id="proveedor">

<option value="">Cargando proveedores...</option>

</select>

<button
type="button"
class="azul"
onclick="abrirNuevoProveedor()">

➕ Nuevo proveedor

</button>

<label>Marca</label>

<input
id="marcaCompra"
placeholder="Marca (opcional)">

<label>Género</label>

<select id="grupoCompra">

<option value="">Cargando géneros...</option>

</select>

<label>Categoría</label>

<select id="categoriaPrenda">

<option value="">Cargando categorías...</option>

</select>

<label>Subcategoría</label>

<select id="subcategoriaPrenda">

<option value="">Seleccione una categoría</option>

</select>

<label>Precio de compra</label>

<input
id="precioCompra"
type="number"
step="0.01">

<label>Observaciones</label>

<input
id="obsCompra">

<button
class="verde"
onclick="crearCompra()">

Continuar

</button>

<button
class="gris"
onclick="volverMenu()">

← Volver

</button>

</div>

<!-- ===================================================== -->
<!-- TIPO DE CARGA -->
<!-- ===================================================== -->

<div id="pantallaTipoCarga">

<h2>Tipo de carga</h2>

<button
class="azul"
onclick="iniciarCargaIndividual()">

👕 Prenda individual

</button>

<button
class="verde"
onclick="mostrarCantidades()">

📦 Compra por curva

</button>

<button
class="gris"
onclick="volverNuevaCompra()">

← Volver

</button>

</div>

<!-- ===================================================== -->
<!-- CANTIDADES -->
<!-- ===================================================== -->

<div id="pantallaCantidades">

<h2>

Cantidad por talle

</h2>

<div id="listaCantidades">

</div>

<button
class="verde"
onclick="continuarCantidades()">

Continuar

</button>

<button
class="gris"
onclick="volverTipoCarga()">

← Volver

</button>

</div>

<!-- ===================================================== -->
<!-- RESUMEN -->
<!-- ===================================================== -->

<div id="pantallaResumen">

<h2>

Resumen de compra

</h2>

<div
id="datosResumen"
class="ficha">

</div>

<button
class="verde"
onclick="iniciarCargaPrendas()">

Comenzar carga

</button>

<button
class="gris"
onclick="volverCantidades()">

← Volver

</button>

</div>

<!-- ===================================================== -->
<!-- CARGA DE PRENDAS -->
<!-- ===================================================== -->

<div id="pantallaCarga">

<h2
id="tituloCarga">

Carga de prendas

</h2>

<div
id="datosCarga"
class="ficha">

</div>

<button
class="gris"
onclick="volverResumen()">

← Volver

</button>

</div>

</div>

<!-- ================= NUEVO PROVEEDOR ================= -->

<div id="pantallaProveedor">

<h2>

Nuevo proveedor

</h2>

<label>Nombre</label>

<input
id="provNombre">

<label>Teléfono</label>

<input
id="provTelefono">

<label>WhatsApp</label>

<input
id="provWhatsapp">

<label>Dirección</label>

<input
id="provDireccion">

<label>Ciudad</label>

<input
id="provCiudad">

<label>Galería</label>

<input
id="provGaleria">

<label>Local</label>

<input
id="provLocal">

<label>Instagram</label>

<input
id="provInstagram">

<label>Observaciones</label>

<input
id="provObs">

<button
class="verde"
onclick="guardarProveedor()">

Guardar proveedor

</button>

<button
class="gris"
onclick="volverNuevaCompra()">

← Cancelar

</button>

</div>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbwsBLmhm8xSx3vsfYEurnFM9m7D4S8WVLrGRBKRmnsx6uHLRAhEHMvzTUXlCW_kFnpC/exec";

let grupoSeleccionado="";
let categoriaSeleccionada="";
let subcategoriaSeleccionada="";

let colaPrendas=[];
let prendasGuardadas=[];
let indicePrenda=0;

let listaGeneros=[];
let listaCategorias=[];
let listaSubcategorias=[];

window.onload=function(){

    volverMenu();

    inicializarFormulario();

};

function inicializarFormulario(){

    const hoy=new Date();

    document.getElementById("fechaCompra").value=
    hoy.toISOString().substring(0,10);

    cargarGeneros();
    cargarCategorias();
    cargarProveedores();

}

function ocultarPantallas(){

document.getElementById("menuPrincipal").style.display="none";
document.getElementById("pantallaBusqueda").style.display="none";
document.getElementById("pantallaNuevaCompra").style.display="none";
document.getElementById("pantallaTipoCarga").style.display="none";
document.getElementById("pantallaCantidades").style.display="none";
document.getElementById("pantallaResumen").style.display="none";
document.getElementById("pantallaCarga").style.display="none";
document.getElementById("pantallaProveedor").style.display="none";

}

function volverMenu(){

    ocultarPantallas();

    document.getElementById("menuPrincipal").style.display="block";

}

function abrirBusqueda(){

    ocultarPantallas();

    document.getElementById("pantallaBusqueda").style.display="block";

}

function abrirNuevaCompra(){

    ocultarPantallas();

    document.getElementById("pantallaNuevaCompra").style.display="block";

}

function abrirNuevoProveedor(){

    ocultarPantallas();

    document.getElementById("pantallaProveedor").style.display="block";

}

    
function volverNuevaCompra(){

    ocultarPantallas();

    const pantalla = document.getElementById("pantallaNuevaCompra");

    if(pantalla){

        pantalla.style.display="block";

        cargarProveedores();

    }else{

        alert("No existe pantallaNuevaCompra");

    }

}


function volverTipoCarga(){

    ocultarPantallas();

    document.getElementById("pantallaTipoCarga").style.display="block";

}

function volverCantidades(){

    ocultarPantallas();

    document.getElementById("pantallaCantidades").style.display="block";

}

function volverResumen(){

    ocultarPantallas();

    document.getElementById("pantallaResumen").style.display="block";

}

/* =====================================================
   CARGA DE DESPLEGABLES
===================================================== */

function cargarGeneros(){

    fetch(URL_SCRIPT+"?accion=generos")

    .then(r=>r.json())

    .then(function(lista){

        listaGeneros=lista;

        const combo=document.getElementById("grupoCompra");

        combo.innerHTML="";

        combo.innerHTML+="<option value=''>Seleccione...</option>";

        lista.forEach(function(item){

            combo.innerHTML+=
            "<option value='"+item.codigo+"'>"+
            item.nombre+
            "</option>";

        });

    });

}



function cargarCategorias(){

    fetch(URL_SCRIPT+"?accion=categorias")

    .then(r=>r.json())

    .then(function(lista){

        listaCategorias=lista;

        const combo=document.getElementById("categoriaPrenda");

        combo.innerHTML="";

        combo.innerHTML+="<option value=''>Seleccione...</option>";

        lista.forEach(function(item){

            combo.innerHTML+=
            "<option value='"+item.codigo+"'>"+
            item.nombre+
            "</option>";

        });

    });

}



function cargarSubcategorias(categoria){

    const combo=document.getElementById("subcategoriaPrenda");

    combo.innerHTML="<option>Cargando...</option>";

    fetch(

        URL_SCRIPT+

        "?accion=subcategorias&categoria="+

        encodeURIComponent(categoria)

    )

    .then(r=>r.json())

    .then(function(lista){

        listaSubcategorias=lista;

        combo.innerHTML="";

        combo.innerHTML+="<option value=''>Seleccione...</option>";

        lista.forEach(function(item){

            combo.innerHTML+=
            "<option value='"+item.codigo+"'>"+
            item.nombre+
            "</option>";

        });

    });

}

function cargarTallesIndividual(){

    fetch(
        URL_SCRIPT+
        "?accion=talles&genero="+
        encodeURIComponent(document.getElementById("grupoCompra").value)
    )

    .then(r=>r.json())

    .then(function(lista){

        const combo =
        document.getElementById("tallePrenda");

        if(!combo){
            return;
        }

        combo.innerHTML="";

        combo.innerHTML+=
        "<option value=''>Seleccione...</option>";

        lista.forEach(function(item){

            combo.innerHTML+=
            "<option value='"+item.talle+"'>"+
            item.talle+
            "</option>";

        });

    });

}
function cargarProveedores(){

    fetch(URL_SCRIPT+"?accion=proveedores")

    .then(r=>r.json())

    .then(function(lista){

        const combo=document.getElementById("proveedor");

        combo.innerHTML="";

        combo.innerHTML+="<option value=''>Seleccione...</option>";

        lista.forEach(function(item){

            combo.innerHTML+=
            "<option value='"+item.nombre+"'>"+
            item.nombre+
            "</option>";

        });

    });

}



/* =====================================================
   EVENTOS DE LOS COMBOS
===================================================== */

document.addEventListener("change",function(e){

    if(e.target.id=="categoriaPrenda"){

        cargarSubcategorias(e.target.value);

    }

});



/* =====================================================
   NUEVA COMPRA
===================================================== */

function crearCompra(){

    const proveedor=
    document.getElementById("proveedor").value;

    const genero=
    document.getElementById("grupoCompra").value;

    const categoria=
    document.getElementById("categoriaPrenda").value;

    const subcategoria=
    document.getElementById("subcategoriaPrenda").value;

    const precio=
    document.getElementById("precioCompra").value;

    if(proveedor==""){

        alert("Seleccione el proveedor.");

        return;

    }

    if(genero==""){

        alert("Seleccione el género.");

        return;

    }

    if(categoria==""){

        alert("Seleccione la categoría.");

        return;

    }

    if(subcategoria==""){

        alert("Seleccione la subcategoría.");

        return;

    }

    if(precio==""){

        alert("Ingrese el precio.");

        return;

    }

    grupoSeleccionado=genero;
    categoriaSeleccionada=categoria;
    subcategoriaSeleccionada=subcategoria;

    localStorage.setItem("fechaCompra",
        document.getElementById("fechaCompra").value);

    localStorage.setItem("proveedor",proveedor);

    localStorage.setItem("marcaCompra",
        document.getElementById("marcaCompra").value.trim());

    localStorage.setItem("precioCompra",precio);

    localStorage.setItem("observaciones",
        document.getElementById("obsCompra").value.trim());

    ocultarPantallas();

    document.getElementById("pantallaTipoCarga").style.display="block";

}

/* =====================================================
   CARGA INDIVIDUAL / CARGA POR CURVA
===================================================== */

function iniciarCargaIndividual(){

    colaPrendas=[];
    prendasGuardadas=[];
    indicePrenda=0;

    colaPrendas.push(null);

    mostrarFormularioPrenda();

}


function mostrarCantidades(){

    ocultarPantallas();

    document.getElementById("pantallaCantidades").style.display="block";

    let talles=[];

    if(

    grupoSeleccionado=="BE" ||

    grupoSeleccionado=="BA" ||

    grupoSeleccionado=="UB"

){

    talles=["TU","0","1","2","3","4","5"];

}else{

    talles=["4","6","8","10","12","14","16"];

}

    let html="";

    html+="<table class='tablaTalles'>";

    talles.forEach(function(t){

        html+="<tr>";

        html+="<td><b>Talle "+t+"</b></td>";

        html+="<td class='celdaCantidad'>";

        html+="<input";

        html+=" class='cantidadTalle'";

        html+=" data-talle='"+t+"'";

        html+=" type='number'";

        html+=" value='1'";

        html+=" min='0'>";

        html+="</td>";

        html+="</tr>";

    });

    html+="</table>";

    document.getElementById("listaCantidades").innerHTML=html;

}



function continuarCantidades(){

    colaPrendas=[];

    document.querySelectorAll(".cantidadTalle")

    .forEach(function(i){

        const cantidad=Number(i.value);

        for(let x=0;x<cantidad;x++){

            colaPrendas.push(i.dataset.talle);

        }

    });

    if(colaPrendas.length==0){

        alert("Debe ingresar al menos una prenda.");

        return;

    }

    mostrarResumen();

}



/* =====================================================
   RESUMEN
===================================================== */

function mostrarResumen(){

    ocultarPantallas();

    document.getElementById("pantallaResumen").style.display="block";

    let html="";

    html+="<b>Proveedor:</b> ";

    html+=localStorage.getItem("proveedor");

    html+="<br>";

    html+="<b>Marca:</b> ";

    html+=localStorage.getItem("marcaCompra") || "-";

    html+="<br>";

    html+="<b>Género:</b> ";

    html+=document.getElementById("grupoCompra").selectedOptions[0].text;

    html+="<br>";

    html+="<b>Categoría:</b> ";

    html+=document.getElementById("categoriaPrenda").selectedOptions[0].text;

    html+="<br>";

    html+="<b>Subcategoría:</b> ";

    html+=document.getElementById("subcategoriaPrenda").selectedOptions[0].text;

    html+="<br>";

    html+="<b>Precio compra:</b> $";

    html+=localStorage.getItem("precioCompra");

    html+="<hr>";

    let contador={};

    colaPrendas.forEach(function(t){

        contador[t]=(contador[t]||0)+1;

    });

    for(let t in contador){

        html+="Talle <b>"+t+"</b>: ";

        html+=contador[t];

        html+=" unidad(es)<br>";

    }

    document.getElementById("datosResumen").innerHTML=html;

}



/* =====================================================
   CARGA DE PRENDAS
===================================================== */

function iniciarCargaPrendas(){

    prendasGuardadas=[];

    indicePrenda=0;

    mostrarFormularioPrenda();

}



function mostrarFormularioPrenda(){

    ocultarPantallas();

    document.getElementById("pantallaCarga").style.display="block";

    if(indicePrenda>=colaPrendas.length){

        enviarCompraCompleta();

        return;

    }

    const talle=colaPrendas[indicePrenda];

    document.getElementById("tituloCarga").innerHTML=

    "Prenda "+(indicePrenda+1)+" de "+colaPrendas.length;

    let html="";

   if(talle){

    html+="<b>Talle:</b> "+talle;

}else{

    html+="<label>Talle</label>";

    html+="<select id='tallePrenda'>";

    html+="<option value=''>Seleccione...</option>";

    html+="</select>";

}

    html+="<br><br>";

    html+="<label>Color</label>";

    html+="<input id='colorPrenda' placeholder='Opcional'>";

    html+="<br><br>";

    html+="<label>Diseño</label>";

    html+="<input id='disenoPrenda' placeholder='Opcional'>";

    html+="<br><br>";

    html+="<button class='verde' onclick='guardarPrendaActual()'>";

    html+="Guardar y continuar";

    html+="</button>";

    document.getElementById("datosCarga").innerHTML=html;

    if(!talle){

    cargarTallesIndividual();

}

}


/* =====================================================
   GUARDAR PRENDA
===================================================== */

function guardarPrendaActual(){

    prendasGuardadas.push({

        genero:grupoSeleccionado,

        categoria:categoriaSeleccionada,

        subcategoria:subcategoriaSeleccionada,

        talle:colaPrendas[indicePrenda],

        color:document.getElementById("colorPrenda").value.trim(),

        diseno:document.getElementById("disenoPrenda").value.trim(),

        precioCompra:Number(localStorage.getItem("precioCompra")),

        precioVenta:0,

        observaciones:localStorage.getItem("observaciones") || ""

    });

   
    indicePrenda++;

    mostrarFormularioPrenda();

}



/* =====================================================
   ENVIAR COMPRA
===================================================== */

function enviarCompraCompleta(){

    const compra={

        fecha:
        localStorage.getItem("fechaCompra"),

        proveedor:
        localStorage.getItem("proveedor"),

        observaciones:
        localStorage.getItem("observaciones") || ""

    };


    console.log("ENVIANDO:");
    console.log(compra);
    console.log(prendasGuardadas);



    fetch(URL_SCRIPT,{

        method:"POST",

        headers:{
            "Content-Type":
            "text/plain;charset=utf-8"
        },


        body:JSON.stringify({

            accion:"guardarCompra",

            compra:compra,

            prendas:prendasGuardadas

        })

    })


    .then(function(respuesta){

        return respuesta.json();

    })


    .then(function(resp){

        console.log(resp);


        if(resp.ok){

            finalizarCarga();

        }else{

            alert(
            "Error Google Sheets: "+
            resp.mensaje
            );

        }


    })


    .catch(function(error){

        console.log(error);

        alert(
        "Error de conexión con Google Apps Script"
        );

    });


}

/* =====================================================
   FINALIZAR
===================================================== */

function finalizarCarga(){

    prendasGuardadas=[];

    colaPrendas=[];

    indicePrenda=0;

    localStorage.clear();

    ocultarPantallas();

    document.getElementById("pantallaCarga").style.display="block";

    document.getElementById("tituloCarga").innerHTML=

    "Proceso terminado";

    document.getElementById("datosCarga").innerHTML=

    "<h2>✅ Compra guardada correctamente</h2>"+

    "<br>"+

    "<button class='verde' onclick='volverMenu()'>Volver al menú</button>";

}



/* =====================================================
   BUSCADOR
===================================================== */

function buscar(){

    const codigo=

    document.getElementById("codigo").value.trim();

    if(codigo==""){

        alert("Ingrese un código.");

        return;

    }

    fetch(

        URL_SCRIPT+

        "?accion=buscar&codigo="+

        encodeURIComponent(codigo)

    )

    .then(r=>r.json())

    .then(mostrar)

    .catch(function(){

        alert("Error de conexión.");

    });

}



function mostrar(p){

    if(!p){

        document.getElementById("resultado").innerHTML=

        "<div class='ficha'><h3>Producto no encontrado</h3></div>";

        return;

    }

    let html="";

    html+="<div class='ficha'>";

    html+="<div class='nombre'>";

    html+=p.subcategoria;

    html+="</div>";

    html+="<div class='dato'><b>Código:</b> ";

    html+=p.codigo;

    html+="</div>";

    html+="<div class='dato'><b>Talle:</b> ";

    html+=p.talle;

    html+="</div>";

    html+="<div class='dato'><b>Color:</b> ";

    html+=p.color;

    html+="</div>";

    html+="<div class='dato'><b>Precio:</b> $";

    html+=p.precioVenta;

    html+="</div>";

    html+="<div class='dato'><b>Estado:</b> ";

    html+=p.estado;

    html+="</div>";

    html+="</div>";

    document.getElementById("resultado").innerHTML=html;

}

function guardarProveedor(){


    const proveedor={

        nombre:
        document.getElementById("provNombre").value.trim(),

        telefono:
        document.getElementById("provTelefono").value.trim(),

        whatsapp:
        document.getElementById("provWhatsapp").value.trim(),

        direccion:
        document.getElementById("provDireccion").value.trim(),

        ciudad:
        document.getElementById("provCiudad").value.trim(),

        galeria:
        document.getElementById("provGaleria").value.trim(),

        local:
        document.getElementById("provLocal").value.trim(),

        instagram:
        document.getElementById("provInstagram").value.trim(),

        observaciones:
        document.getElementById("provObs").value.trim()

    };


    if(proveedor.nombre==""){

        alert("Ingrese el nombre del proveedor.");

        return;

    }



    fetch(URL_SCRIPT,{

        method:"POST",

        headers:{
            "Content-Type":"text/plain;charset=utf-8"
        },

        body:JSON.stringify({

            accion:"guardarProveedor",

            proveedor:proveedor

        })

    })


    .then(function(respuesta){

        return respuesta.json();

    })


    .then(function(resp){


        console.log("Respuesta servidor:",resp);



        if(resp.ok){


            alert("Proveedor guardado correctamente.");



            // Actualiza la lista de proveedores

            cargarProveedores();



            // Espera que cargue el combo

            setTimeout(function(){


                document.getElementById("proveedor").value =
                proveedor.nombre;



                limpiarFormularioProveedor();



                volverNuevaCompra();



            },500);



        }else{


            alert(
                "Error al guardar proveedor: "
                + resp.mensaje
            );


        }



    })


    .catch(function(error){


        console.log(error);


        alert(
            "Error de conexión al guardar proveedor: "
            + error
        );


    });


}





function limpiarFormularioProveedor(){


    document.getElementById("provNombre").value="";

    document.getElementById("provTelefono").value="";

    document.getElementById("provWhatsapp").value="";

    document.getElementById("provDireccion").value="";

    document.getElementById("provCiudad").value="";

    document.getElementById("provGaleria").value="";

    document.getElementById("provLocal").value="";

    document.getElementById("provInstagram").value="";

    document.getElementById("provObs").value="";


}

function iniciarCamara(){

    document.getElementById("reader").innerHTML="";

    const lector=new Html5Qrcode("reader");

    lector.start(

        {facingMode:"environment"},

        {

            fps:10,

            qrbox:{width:260,height:110}

        },

        function(texto){

            document.getElementById("codigo").value=texto;

            lector.stop().then(function(){

                buscar();

            });

        },

        function(){}

    );

}
