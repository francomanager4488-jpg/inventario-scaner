<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{

font-family:Arial;

background:#f3f3f3;

margin:0;

padding:20px;

}


.card{

max-width:500px;

margin:auto;

background:white;

border-radius:12px;

padding:20px;

box-shadow:
0 2px 12px
rgba(0,0,0,.2);

}


h2{

text-align:center;

margin-top:0;

}


input,
select{

width:100%;

padding:15px;

font-size:20px;

box-sizing:border-box;

margin-top:10px;

border:
1px solid #ccc;

border-radius:6px;

}


button{

width:100%;

padding:15px;

margin-top:12px;

font-size:20px;

border:none;

border-radius:8px;

cursor:pointer;

}


#buscar{

background:#1976d2;

color:white;

}


#camara{

background:#43a047;

color:white;

}


#cambiarEstado{

background:#ff9800;

color:white;

}


#resultado{

margin-top:20px;

font-size:18px;

line-height:1.7;

}


#reader{

margin-top:20px;

}


.estado{

padding:10px;

margin-top:15px;

border-radius:8px;

background:#eeeeee;

}


.estadoActual{

font-size:20px;

font-weight:bold;

}


.mensaje{

margin-top:15px;

padding:12px;

border-radius:8px;

background:#e8f5e9;

color:#2e7d32;

}


.error{

background:#ffebee;

color:#c62828;

}


</style>

</head>


<body>


<div class="card">


<h2>
📦 INVENTARIO
</h2>


<input
id="codigo"
placeholder="Código de barras"
autocomplete="off">


<button
id="camara"
onclick="iniciarCamara()">

📷 Escanear

</button>


<button
id="buscar"
onclick="buscar()">

🔎 Buscar

</button>


<div id="reader"></div>


<div id="resultado"></div>


</div>


<script>


const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbwsBLmhm8xSx3vsfYEurnFM9m7D4S8WVLrGRBKRmnsx6uHLRAhEHMvzTUXlCW_kFnpC/exec";


let productoActual=null;

let html5QrCode=null;


/************************************************************
 * BUSCAR
 ************************************************************/

function buscar(){

const codigo =
document
.getElementById("codigo")
.value
.trim();


if(!codigo){

alert(
"Ingrese un código."
);

return;

}


document
.getElementById("resultado")
.innerHTML=
"Buscando...";


fetch(
URL_SCRIPT+
"?accion=buscar&codigo="+
encodeURIComponent(codigo)
)

.then(
r=>r.json()
)

.then(
mostrar
)

.catch(
error=>{

document
.getElementById("resultado")
.innerHTML=

'<div class="error">'+
'Error al buscar el producto.'+
'</div>';

console.error(error);

});

}


/************************************************************
 * MOSTRAR PRODUCTO
 ************************************************************/

function mostrar(p){

productoActual=p;


if(!p){

document
.getElementById("resultado")
.innerHTML=

"<h3>Producto no encontrado</h3>";

return;

}


document
.getElementById("resultado")
.innerHTML=

"<h2>"+
(p.descripcion || "")+
"</h2>"+

"<b>Código:</b> "+
(p.codigo || "")+
"<br>"+

"<b>Género:</b> "+
(p.genero || "")+
"<br>"+

"<b>Categoría:</b> "+
(p.categoria || "")+
"<br>"+

"<b>Subcategoría:</b> "+
(p.subcategoria || "")+
"<br>"+

"<b>Talle:</b> "+
(p.talle || "")+
"<br>"+

"<b>Color:</b> "+
(p.color || "")+
"<br>"+

"<b>Diseño:</b> "+
(p.diseño || "")+
"<br>"+

"<b>Precio compra:</b> $"+
(p.precioCompra || 0)+
"<br>"+

"<b>Precio venta:</b> $"+
(p.precioVenta || 0)+
"<br>"+

"<div class='estado'>"+

"<div class='estadoActual'>"+
"Estado actual: "+
(p.estado || "")+
"</div>"+

"<select id='nuevoEstado'>"+

"<option value='Disponible' "+
(p.estado=="Disponible"?"selected":"")+
">Disponible</option>"+

"<option value='Defectuoso' "+
(p.estado=="Defectuoso"?"selected":"")+
">Defectuoso</option>"+

"<option value='Vendido' "+
(p.estado=="Vendido"?"selected":"")+
">Vendido</option>"+

"</select>"+

"<button id='cambiarEstado' "+
"onclick='cambiarEstado()'>"+

"💾 Cambiar estado"+

"</button>"+

"</div>";

}


/************************************************************
 * CAMBIAR ESTADO
 ************************************************************/

function cambiarEstado(){

if(!productoActual){

alert(
"No hay ningún producto cargado."
);

return;

}


const nuevoEstado =
document
.getElementById("nuevoEstado")
.value;


if(
nuevoEstado==
productoActual.estado
){

alert(
"El producto ya tiene ese estado."
);

return;

}


if(
nuevoEstado=="Vendido"
){

const confirmar =
confirm(
"¿Confirmar que esta prenda fue vendida?\n\n"+
"El producto será pasado a la hoja VENTAS."
);


if(!confirmar){

return;

}

}


if(
nuevoEstado=="Defectuoso"
){

const confirmar =
confirm(
"¿Marcar esta prenda como DEFECTUOSA?"
);


if(!confirmar){

return;

}

}


const datos={

accion:
"cambiarEstado",

codigo:
productoActual.codigo,

estado:
nuevoEstado

};


document
.getElementById("cambiarEstado")
.disabled=true;


fetch(
URL_SCRIPT,
{

method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:
JSON.stringify(datos)

})

.then(
r=>r.json()
)

.then(
resp=>{

document
.getElementById("cambiarEstado")
.disabled=false;


if(!resp.ok){

alert(
resp.mensaje
);

return;

}


if(
nuevoEstado=="Vendido"
){

document
.getElementById("resultado")
.innerHTML=

"<div class='mensaje'>"+
"✅ "+resp.mensaje+
"</div>";

productoActual=null;

document
.getElementById("codigo")
.value="";

return;

}


productoActual.estado=
nuevoEstado;


mostrar(productoActual);


const mensaje =
document.createElement("div");


mensaje.className=
"mensaje";


mensaje.innerHTML=
"✅ "+
resp.mensaje;


document
.getElementById("resultado")
.appendChild(
mensaje
);

})

.catch(
error=>{

document
.getElementById("cambiarEstado")
.disabled=false;

alert(
"Error: "+
error
);

});

}


/************************************************************
 * CAMARA
 ************************************************************/

function iniciarCamara(){

document
.getElementById("reader")
.innerHTML="";


if(html5QrCode){

try{

html5QrCode.stop();

}catch(e){}

}


html5QrCode =
new Html5Qrcode(
"reader"
);


navigator
.mediaDevices
.getUserMedia({

video:{
facingMode:"environment"
}

})

.then(
stream=>{

stream
.getTracks()
.forEach(
track=>track.stop()
);


html5QrCode
.start(

{
facingMode:{
ideal:"environment"
}
},

{

fps:10,

qrbox:{
width:280,
height:120
},

formatsToSupport:[

Html5QrcodeSupportedFormats.CODE_128,

Html5QrcodeSupportedFormats.EAN_13,

Html5QrcodeSupportedFormats.EAN_8,

Html5QrcodeSupportedFormats.CODE_39,

Html5QrcodeSupportedFormats.UPC_A,

Html5QrcodeSupportedFormats.UPC_E

]

},

codigo=>{

document
.getElementById("codigo")
.value=codigo;


html5QrCode
.stop()
.then(
()=>{

buscar();

}
)
.catch(
()=>{

buscar();

}
);

},

error=>{}

)

.catch(
error=>{

alert(
"No se pudo iniciar el escáner: "+
error
);

});

})

.catch(
error=>{

alert(
"Permiso de cámara rechazado: "+
error.name
);

});

}


/************************************************************
 * ENTER EN EL CAMPO
 ************************************************************/

document
.getElementById("codigo")
.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter"
){

buscar();

}

});

</script>

</body>

</html>
