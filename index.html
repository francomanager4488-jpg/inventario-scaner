<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Ropita de Cuento - Inventario</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f3f3f3;
      margin:0;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:500px;
      margin:0 auto;
      background:white;
      border-radius:14px;
      padding:22px;
      box-shadow:0 2px 12px rgba(0,0,0,.18);
    }

    h1,
    h2{
      text-align:center;
      margin-top:0;
    }

    .logo{
      text-align:center;
      font-size:25px;
      font-weight:bold;
      margin-bottom:25px;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:12px;
      font-size:19px;
      border:none;
      border-radius:9px;
      cursor:pointer;
      color:white;
    }

    button:active{
      transform:scale(.98);
    }

    .verde{
      background:#43a047;
    }

    .azul{
      background:#1976d2;
    }

    .naranja{
      background:#ef6c00;
    }

    .gris{
      background:#757575;
    }

    input{
      width:100%;
      padding:15px;
      font-size:20px;
      margin-top:10px;
      border:1px solid #ccc;
      border-radius:8px;
    }

    #reader{
      width:100%;
      margin-top:20px;
    }

    #resultado{
      margin-top:20px;
      line-height:1.7;
      font-size:18px;
    }

    .producto{
      background:#f5f5f5;
      border-radius:10px;
      padding:15px;
      margin-top:15px;
    }

    .producto-titulo{
      font-size:21px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .dato{
      margin-top:5px;
    }

    .oculto{
      display:none;
    }

    .separador{
      height:1px;
      background:#ddd;
      margin:20px 0;
    }

    .mensaje{
      text-align:center;
      margin-top:15px;
      color:#555;
    }

  </style>

</head>


<body>


<!-- =====================================================
     MENU PRINCIPAL
     ===================================================== -->

<div id="menu" class="card">

  <div class="logo">
    📦 ROPITA DE CUENTO
  </div>

  <h2>Inventario</h2>

  <button
    class="verde"
    onclick="abrirCarga()">
    👕 Cargar prenda
  </button>

  <button
    class="azul"
    onclick="mostrarBusqueda()">
    🔎 Buscar producto
  </button>

  <button
    class="naranja"
    onclick="mostrarEscaner()">
    📷 Escanear producto
  </button>

</div>


<!-- =====================================================
     BUSQUEDA / ESCANER
     ===================================================== -->

<div id="pantallaBusqueda"
     class="card oculto">

  <h2>🔎 Buscar producto</h2>

  <input
    id="codigo"
    type="text"
    placeholder="Código de barras">

  <button
    class="azul"
    onclick="buscar()">
    Buscar
  </button>

  <button
    class="naranja"
    onclick="iniciarCamara()">
    📷 Escanear
  </button>

  <button
    class="gris"
    onclick="volverMenu()">
    ← Volver
  </button>

  <div id="reader"></div>

  <div id="resultado"></div>

</div>


<script>


/* =====================================================
   CONFIGURACION
   ===================================================== */

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbwsBLmhm8xSx3vsfYEurnFM9m7D4S8WVLrGRBKRmnsx6uHLRAhEHMvzTUXlCW_kFnpC/exec";


let html5QrCode = null;


/* =====================================================
   MENU
   ===================================================== */

function abrirCarga(){

  /*
   * alta.html debe estar en el mismo repositorio
   * de GitHub Pages que este index.html.
   */

  window.location.href = "alta.html";

}


function mostrarBusqueda(){

  document.getElementById("menu")
    .classList.add("oculto");

  document.getElementById("pantallaBusqueda")
    .classList.remove("oculto");

  document.getElementById("resultado")
    .innerHTML="";

  document.getElementById("codigo")
    .value="";

}


function mostrarEscaner(){

  mostrarBusqueda();

  setTimeout(function(){

    iniciarCamara();

  },300);

}


function volverMenu(){

  detenerCamara();

  document.getElementById("pantallaBusqueda")
    .classList.add("oculto");

  document.getElementById("menu")
    .classList.remove("oculto");

}


/* =====================================================
   BUSCAR PRODUCTO
   ===================================================== */

function buscar(){

  const codigo =
    document.getElementById("codigo")
    .value
    .trim();


  if(codigo===""){

    alert("Ingrese o escanee un código.");

    return;

  }


  document.getElementById("resultado")
    .innerHTML=
      "<div class='mensaje'>Buscando producto...</div>";


  fetch(
    URL_SCRIPT +
    "?accion=buscar&codigo=" +
    encodeURIComponent(codigo)
  )

  .then(function(response){

    if(!response.ok){

      throw new Error(
        "Error HTTP " + response.status
      );

    }

    return response.json();

  })

  .then(function(producto){

    mostrarProducto(producto);

  })

  .catch(function(error){

    console.error(error);

    document.getElementById("resultado")
      .innerHTML=
      "<div class='producto'>" +
      "<b>Error al consultar el inventario.</b><br>" +
      error.message +
      "</div>";

  });

}


/* =====================================================
   MOSTRAR PRODUCTO
   ===================================================== */

function mostrarProducto(p){

  if(!p){

    document.getElementById("resultado")
      .innerHTML=
      "<div class='producto'>" +
      "<div class='producto-titulo'>" +
      "❌ Producto no encontrado" +
      "</div>" +
      "</div>";

    return;

  }


  const precioCompra =
    Number(p.precioCompra || 0)
      .toLocaleString("es-AR",{
        minimumFractionDigits:2
      });


  const precioVenta =
    Number(p.precioVenta || 0)
      .toLocaleString("es-AR",{
        minimumFractionDigits:2
      });


  document.getElementById("resultado")
    .innerHTML=

    "<div class='producto'>" +

      "<div class='producto-titulo'>" +
        "📦 " +
        (p.codigo || "") +
      "</div>" +

      "<div class='dato'>" +
        "<b>Descripción:</b> " +
        (p.descripcion || "") +
      "</div>" +

      "<div class='dato'>" +
        "<b>Género:</b> " +
        (p.genero || "") +
      "</div>" +

      "<div class='dato'>" +
        "<b>Categoría:</b> " +
        (p.categoria || "") +
      "</div>" +

      "<div class='dato'>" +
        "<b>Subcategoría:</b> " +
        (p.subcategoria || "") +
      "</div>" +

      "<div class='dato'>" +
        "<b>Talle:</b> " +
        (p.talle || "") +
      "</div>" +

      "<div class='dato'>" +
        "<b>Color:</b> " +
        (p.color || "") +
      "</div>" +

      "<div class='dato'>" +
        "<b>Diseño:</b> " +
        (p.diseno || "") +
      "</div>" +

      "<div class='dato'>" +
        "<b>Precio compra:</b> $" +
        precioCompra +
      "</div>" +

      "<div class='dato'>" +
        "<b>Precio venta:</b> $" +
        precioVenta +
      "</div>" +

      "<div class='dato'>" +
        "<b>Estado:</b> " +
        (p.estado || "") +
      "</div>" +

      "<div class='dato'>" +
        "<b>Observaciones:</b> " +
        (p.observaciones || "") +
      "</div>" +

    "</div>";

}


/* =====================================================
   CAMARA
   ===================================================== */

function iniciarCamara(){

  if(typeof Html5Qrcode === "undefined"){

    alert(
      "No se pudo cargar el lector de códigos."
    );

    return;

  }


  detenerCamara();


  document.getElementById("reader")
    .innerHTML="";


  html5QrCode =
    new Html5Qrcode("reader");


  html5QrCode.start(

    {
      facingMode:"environment"
    },

    {
      fps:10,

      qrbox:{
        width:280,
        height:120
      },

      formatsToSupport:[

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    },

    function(codigo){

      document.getElementById("codigo")
        .value=codigo;


      detenerCamara();


      buscar();

    },

    function(error){

      /*
       * Los errores de lectura normales
       * no se muestran para no llenar la pantalla.
       */

    }

  )

  .catch(function(error){

    console.error(error);

    document.getElementById("reader")
      .innerHTML=
      "<div class='mensaje'>" +
      "No se pudo iniciar la cámara.<br><br>" +
      "Verificá que el navegador tenga permiso " +
      "para utilizar la cámara." +
      "</div>";

  });

}


/* =====================================================
   DETENER CAMARA
   ===================================================== */

function detenerCamara(){

  if(
    html5QrCode &&
    html5QrCode.isScanning
  ){

    html5QrCode.stop()

      .then(function(){

        html5QrCode.clear();

        html5QrCode=null;

      })

      .catch(function(error){

        console.log(
          "Error al detener cámara:",
          error
        );

        html5QrCode=null;

      });

  }

}


</script>

</body>

</html>
