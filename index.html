<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Ropita de Cuento</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    padding:20px;
    background:#f3f3f3;
    font-family:Arial,Helvetica,sans-serif;

}

.card{

    max-width:700px;
    margin:auto;
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,.20);

}

h2,h3{

    text-align:center;
    margin-top:0;

}

label{

    display:block;
    margin-top:15px;
    font-weight:bold;

}

input,
select{

    width:100%;
    padding:14px;
    margin-top:8px;
    font-size:18px;

}

button{

    width:100%;
    padding:15px;
    margin-top:12px;
    border:none;
    border-radius:8px;
    font-size:20px;
    cursor:pointer;

}

.azul{

    background:#1976d2;
    color:white;

}

.verde{

    background:#43a047;
    color:white;

}

.gris{

    background:#757575;
    color:white;

}

.rojo{

    background:#c62828;
    color:white;

}

#reader{

    margin-top:20px;

}

#resultado{

    margin-top:20px;

}

.ficha{

    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    background:#fafafa;

}

.nombre{

    font-size:28px;
    font-weight:bold;
    color:#1565c0;
    margin-bottom:15px;

}

.dato{

    font-size:19px;
    margin:8px 0;

}

.stock-ok{

    color:green;
    font-weight:bold;

}

.stock-cero{

    color:red;
    font-weight:bold;

}

#menuPrincipal,
#pantallaBusqueda,
#pantallaNuevaCompra,
#pantallaCantidades,
#pantallaDatos,
#pantallaResumen,
#pantallaCarga{

    display:none;

}

#menuPrincipal{

    display:block;

}

.tablaTalles{

    width:100%;
    border-collapse:collapse;

}

.tablaTalles td{

    padding:10px;
    border-bottom:1px solid #ddd;

}

.celdaCantidad{

    width:90px;

}

.celdaCantidad input{

    text-align:center;

}

</style>

</head>

<body>

<div class="card">

<!-- ========================================= -->
<!-- MENU PRINCIPAL -->
<!-- ========================================= -->

<div id="menuPrincipal">

<h2>📦 ROPITA DE CUENTO</h2>

<button
class="azul"
onclick="abrirBusqueda()">

🔍 Buscar prenda

</button>

<button
class="verde"
onclick="abrirNuevaCompra()">

📦 Nueva compra

</button>

<button
class="gris"
onclick="alert('Próximamente')">

🏷 Imprimir etiquetas

</button>

<button
class="gris"
onclick="alert('Próximamente')">

📊 Inventario

</button>

<button
class="gris"
onclick="alert('Próximamente')">

⚙ Configuración

</button>

</div>

<!-- ========================================= -->
<!-- BUSQUEDA -->
<!-- ========================================= -->

<div id="pantallaBusqueda">

<h2>Buscar prenda</h2>

<input
id="codigo"
placeholder="Escanear o escribir código">

<button
class="verde"
onclick="iniciarCamara()">

📷 Escanear

</button>

<button
class="azul"
onclick="buscar()">

Buscar

</button>

<div id="reader"></div>

<div id="resultado"></div>

<button
class="gris"
onclick="volverMenu()">

← Volver

</button>

</div>

<!-- ========================================= -->
<!-- NUEVA COMPRA -->
<!-- ========================================= -->

<div id="pantallaNuevaCompra">

<h2>Nueva compra</h2>

<label>Fecha</label>

<input
type="date"
id="fechaCompra">

<label>Proveedor</label>

<input
id="proveedor"
placeholder="Proveedor">

<label>Marca (opcional)</label>

<input
id="marcaCompra"
placeholder="Marca">

<label>Género</label>

<select id="grupoCompra">

<option value="">Seleccione...</option>

<option value="BEBE">👶 Bebé</option>

<option value="BEBA">👧 Beba</option>

<option value="NENE">🧒 Nene</option>

<option value="NENA">👧 Nena</option>

<option value="UNISEX_BEBE">🍼 Unisex bebé</option>

<option value="UNISEX_NENE">👕 Unisex nene</option>

</select>

<label>Precio de compra</label>

<input
id="precioCompra"
type="number"
step="0.01"
placeholder="0">

<label>Tipo de prenda</label>

<input
id="tipoPrenda"
placeholder="Ej.: Remera">

<label>Observaciones</label>

<input
id="obsCompra"
placeholder="Opcional">

<button
class="verde"
onclick="crearCompra()">

Continuar

</button>

<button
class="gris"
onclick="volverMenu()">

← Volver

</button>

</div>

<!-- ========================================= -->
<!-- CANTIDAD POR TALLE -->
<!-- ========================================= -->

<div id="pantallaCantidades">

<h2 id="tituloCantidades">

Cantidad por talle

</h2>

<div id="listaCantidades">

</div>

<button
class="verde"
onclick="continuarCantidades()">

Continuar

</button>

<button
class="gris"
onclick="volverNuevaCompra()">

← Volver

</button>

</div>

<!-- ========================================= -->
<!-- RESUMEN -->
<!-- ========================================= -->

<div id="pantallaResumen">

<h2>Resumen</h2>

<div
id="datosResumen"
style="
background:#f5f5f5;
padding:15px;
border-radius:10px;
">

</div>

<button
class="verde"
onclick="iniciarCargaPrendas()">

Comenzar carga

</button>

<button
class="gris"
onclick="volverCantidades()">

← Volver

</button>

</div>

<!-- ========================================= -->
<!-- CARGA DE PRENDAS -->
<!-- ========================================= -->

<div id="pantallaCarga">

<h2 id="tituloCarga">

Carga de prendas

</h2>

<div
id="datosCarga"
style="
background:#f5f5f5;
padding:15px;
border-radius:10px;
">

</div>

<button
class="gris"
onclick="volverResumen()">

← Volver

</button>

</div>

</div>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbwsBLmhm8xSx3vsfYEurnFM9m7D4S8WVLrGRBKRmnsx6uHLRAhEHMvzTUXlCW_kFnpC/exec";

let grupoSeleccionado="";
let colaPrendas=[];
let indicePrenda=0;
let prendasGuardadas=[];
