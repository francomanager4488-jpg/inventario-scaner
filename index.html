<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ropita de Cuento - Inventario v1.0.1</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:Arial,sans-serif;background:#f3f3f3;margin:0;padding:20px}
.card{max-width:520px;margin:auto;background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
button,input{width:100%;padding:14px;margin-top:10px;box-sizing:border-box;font-size:18px}
button{border:none;border-radius:8px;cursor:pointer}
.prim{background:#1976d2;color:#fff}.sec{background:#43a047;color:#fff}.gris{background:#757575;color:#fff}
#pantallaBusqueda,#pantallaNuevaCompra{display:none}
</style>
</head>
<body>
<div class="card">

<div id="menuPrincipal">
<h2>📦 ROPITA DE CUENTO</h2>
<button class="prim" onclick="abrirBusqueda()">🔍 Buscar prenda</button>
<button class="sec" onclick="abrirNuevaCompra()">📦 Nueva compra</button>
<button class="gris" onclick="alert('Próximamente')">⚙ Configuración</button>
</div>

<div id="pantallaBusqueda">
<h2>Buscar prenda</h2>
<input id="codigo" placeholder="Escanear o escribir código">
<button class="sec" onclick="iniciarCamara()">📷 Escanear</button>
<button class="prim" onclick="buscar()">Buscar</button>
<div id="reader"></div>
<div id="resultado"></div>
<button class="gris" onclick="volverMenu()">← Volver</button>
</div>

<div id="pantallaNuevaCompra">
<h2>📦 Nueva compra</h2>
<input type="date" id="fechaCompra">
<input id="proveedor" placeholder="Proveedor">
<input id="obsCompra" placeholder="Observaciones">
<button class="sec" onclick="crearCompra()">Crear compra</button>
<button class="gris" onclick="volverMenu()">← Volver</button>
</div>

</div>

<script>
const URL_SCRIPT="https://script.google.com/macros/s/AKfycbwsBLmhm8xSx3vsfYEurnFM9m7D4S8WVLrGRBKRmnsx6uHLRAhEHMvzTUXlCW_kFnpC/exec";
function abrirBusqueda(){menuPrincipal.style.display="none";pantallaNuevaCompra.style.display="none";pantallaBusqueda.style.display="block";}
function abrirNuevaCompra(){menuPrincipal.style.display="none";pantallaBusqueda.style.display="none";pantallaNuevaCompra.style.display="block";}
function volverMenu(){menuPrincipal.style.display="block";pantallaBusqueda.style.display="none";pantallaNuevaCompra.style.display="none";resultado.innerHTML="";reader.innerHTML="";codigo.value="";}
function crearCompra(){alert("Formulario listo. En el próximo paso quedará conectado con Google Sheets.");}
function buscar(){const c=codigo.value.trim();if(!c){alert("Ingrese un código");return;}
fetch(URL_SCRIPT+"?accion=buscar&codigo="+encodeURIComponent(c)).then(r=>r.json()).then(p=>{resultado.innerHTML=p?`<pre>${JSON.stringify(p,null,2)}</pre>`:"Producto no encontrado";}).catch(()=>resultado.innerHTML="Error");}
function iniciarCamara(){const qr=new Html5Qrcode("reader");reader.innerHTML="";
qr.start({facingMode:"environment"},{fps:15,qrbox:{width:220,height:100}},t=>{codigo.value=t;qr.stop().then(buscar);},()=>{});}
</script>
</body>
</html>
